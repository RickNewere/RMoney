<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>RMoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RMoney">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg:#f2f4f7; --card:#ffffff; --field:#ffffff; --border:#cfd4dc;
      --text:#1a1a1a; --muted:#6b7280; --accent:#2563eb; --accentDim:#9db8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1115; --card:#1a1d24; --field:#262a33; --border:#3a3f4b;
        --text:#f2f4f7; --muted:#9aa3b2; --accent:#3b82f6; --accentDim:#28466f;
      }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; background:var(--bg); }
    body {
      font-family:-apple-system, system-ui, Roboto, Arial, sans-serif;
      color:var(--text); padding:max(16px, env(safe-area-inset-top)) 14px 40px;
    }
    .brand { text-align:center; font-size:28px; font-weight:800; margin:12px 0 18px; }
    .card { max-width:480px; margin:0 auto; background:var(--card); border-radius:20px; padding:18px; }
    label { display:block; font-size:13px; font-weight:700; color:var(--muted); margin:16px 0 6px; }
    input, select {
      width:100%; font-size:17px; padding:13px 12px; border:1px solid var(--border);
      border-radius:12px; background:var(--field); color:var(--text); appearance:none; -webkit-appearance:none;
    }
    textarea {
      width:100%; font-size:17px; padding:13px 12px; border:1px solid var(--border);
      border-radius:12px; background:var(--field); color:var(--text); min-height:70px; resize:vertical;
    }
    .seg { display:flex; gap:8px; }
    .seg button {
      flex:1; padding:12px; border-radius:12px; border:1px solid var(--border);
      background:transparent; color:var(--text); font-size:16px; font-weight:700;
    }
    .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .check { display:flex; align-items:center; margin-top:20px; }
    .check .box {
      width:26px; height:26px; border-radius:7px; border:2px solid var(--border);
      margin-right:12px; display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:900; font-size:17px;
    }
    .check .box.on { background:var(--accent); border-color:var(--accent); }
    .check span { font-size:15px; font-weight:600; }
    #btn {
      width:100%; margin-top:22px; padding:16px; border:none; border-radius:14px;
      background:var(--accent); color:#fff; font-size:18px; font-weight:800;
    }
    #btn:disabled { background:var(--accentDim); }
    #msg { text-align:center; margin-top:16px; font-weight:700; min-height:22px; font-size:15px; }
    .ok { color:#16a34a; } .err { color:#dc2626; }
    .debt { padding:14px 18px; margin-bottom:14px; }
    .debtTitle { font-size:12px; font-weight:800; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px; }
    .debtRow { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:6px 0; }
    .debtRow.net { border-top:1px solid var(--border); margin-top:4px; padding-top:12px; }
    .debtLbl { font-size:14px; color:var(--text); }
    .debtVal { font-size:17px; font-weight:800; color:var(--accent); white-space:nowrap; }
    .debtVal.zero { color:var(--muted); font-weight:600; font-size:14px; }
    .saldaBtn { width:100%; margin-top:14px; padding:11px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:14px; font-weight:700; }
    .saldaBtn:disabled { opacity:.5; }
    .saldaMsg { text-align:center; margin-top:8px; font-size:13px; font-weight:600; min-height:16px; }
    .topToggle { max-width:480px; margin:0 auto 14px; }
    .periodLbl { text-align:center; font-size:13px; color:var(--muted); margin-top:12px; }
    .ovGrid { display:flex; gap:10px; }
    .ovCell { flex:1; text-align:center; padding:10px 6px; border:1px solid var(--border); border-radius:12px; }
    .ovLbl { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
    .ovVal { font-size:16px; font-weight:800; margin-top:4px; white-space:nowrap; }
    .ovVal.pos { color:#16a34a; } .ovVal.neg { color:#dc2626; }
    .ovTable { width:100%; border-collapse:collapse; font-size:12px; }
    .ovTable th, .ovTable td { padding:8px 3px; text-align:right; white-space:nowrap; }
    .ovTable thead th { font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
    .ovTable tbody th { text-align:left; font-weight:800; font-size:13px; padding-right:8px; }
    .ovTable tbody tr + tr th, .ovTable tbody tr + tr td { border-top:1px solid var(--border); }
    .ovTable tr.combo th, .ovTable tr.combo td { font-weight:800; }
    .ovTable td.pos { color:#16a34a; } .ovTable td.neg { color:#dc2626; }
    .secTitle { font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; }
    .card + .card { margin-top:14px; }
    canvas { max-width:100%; }
    .donutRow { display:flex; gap:6px; margin-top:16px; }
    .donutCell { flex:1; min-width:0; text-align:center; }
    .donutTit { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; }
    .donutLegend { text-align:center; margin-top:12px; font-size:12px; color:var(--muted); }
    .donutLegend .dl { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px; vertical-align:middle; }
    .donutLegend .dl.s { background:#ec4899; } .donutLegend .dl.e { background:#16a34a; }
    .donutVals { margin-top:8px; font-size:11px; line-height:1.6; }
    .donutVals div { white-space:nowrap; }
    .donutVals .dot { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
    .donutVals .dot.s { background:#ec4899; } .donutVals .dot.e { background:#16a34a; }
    #riepMsg { text-align:center; margin-top:14px; font-weight:700; min-height:22px; font-size:15px; }
    #catChi { margin-bottom:16px; }
    #catChi button { padding:9px 4px; font-size:14px; }
    .catTable { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
    .catTable td { padding:7px 2px; border-top:1px solid var(--border); vertical-align:middle; }
    .catTable td.c { text-align:left; font-weight:600; }
    .catTable td.v { text-align:right; font-weight:700; white-space:nowrap; }
    .catTable td.p { text-align:right; color:var(--muted); width:38px; white-space:nowrap; }
    .catTable .sub { display:block; font-size:10px; font-weight:500; color:var(--muted); margin-top:2px; }
    .catTable tr.tot td { border-top:2px solid var(--border); font-weight:800; font-size:13px; }
    .catEmpty { text-align:center; color:var(--muted); font-size:13px; padding:18px 0; }
    .catLink { color:var(--accent); text-decoration:underline; cursor:pointer; }
    /* Sticky in cima: dalle liste lunghe si torna indietro senza risalire. */
    .backBtn {
      display:block; max-width:480px; margin:0 auto 14px; width:100%;
      position:sticky; top:0; z-index:5;
      padding:13px; border-radius:14px; border:1px solid var(--border);
      background:var(--card); color:var(--accent); font-size:16px; font-weight:800; text-align:left;
    }
    .detTitle { font-size:20px; font-weight:800; margin:0 0 4px; }
    .detSub { font-size:13px; color:var(--muted); margin-bottom:16px; }
    #detChi button { padding:9px 4px; font-size:14px; }
    .detTable { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
    .detTable td { padding:10px 2px; border-top:1px solid var(--border); vertical-align:top; }
    .detTable td.d { text-align:left; }
    .detTable td.v { text-align:right; font-weight:800; white-space:nowrap; padding-left:10px; }
    .detTable .nota { display:block; font-size:12px; color:var(--muted); margin-top:3px; }
    .detTable .chi { display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); margin-left:6px; }
    .detTable tr.tot td { border-top:2px solid var(--border); font-weight:800; font-size:14px; }
    .detTable td.x { width:34px; text-align:right; padding-left:6px; }
    .delBtn {
      width:30px; height:30px; border-radius:9px; border:1px solid var(--border);
      background:transparent; color:#dc2626; font-size:16px; font-weight:800; line-height:1; padding:0;
    }
    .delBtn:disabled { opacity:.4; }
    .detHint { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5; }
  </style>
</head>
<body>

        <div class="donutCell"><div class="donutTit">Totale</div><canvas id="chDonutTot"></canvas><div class="donutVals" id="valsTot"></div></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script>
    var API = 'https://script.google.com/macros/s/AKfycbwco9LegI0F39m2SsLMX1zuWwBhlR40IBmRlxFrPeGmSaJb_kTaBVlmZtaxCHRv5UFPcA/exec';
    var TABS = {
      Riccardo: { Euro: 113020932, Franchi: 650699013 },
      Roberta:  { Euro: 1888286288, Franchi: 1063479927 }
    };
    var persona = 'Riccardo', conto = 'Euro', segno = false;

    document.getElementById('data').value = new Date().toISOString().slice(0, 10);
    function gid() { return TABS[persona][conto]; }

    // ---- Lettura delle risposte del backend ----
    // Apps Script ogni tanto risponde con una PAGINA HTML al posto del JSON: il
    // /exec passa da un redirect su googleusercontent, e quando quel passaggio
    // inciampa torna indietro una pagina di Google con stato 200. Chiamando
    // r.json() l'errore che ne esce e' opaco e cambia da browser a browser: su
    // Safari e' "The string did not match the expected pattern", che non dice
    // niente a nessuno e sembra un bug dell'app.
    //
    // Qui la risposta si legge come testo, si riconosce il caso e si alza un
    // errore comprensibile. Tutte le chiamate passano di qui: prima ognuna
    // faceva il proprio .json(), ed e' il motivo per cui lo stesso guasto e'
    // saltato fuori due volte in punti diversi.
    function leggiRisposta(r) {
      return r.text().then(function (t) {
        var s = (t || '').trim();
        if (s.charAt(0) === '<') {
          throw new Error('Il server ha risposto con una pagina invece dei dati');
        }
        try {
          return JSON.parse(s);
        } catch (e) {
          throw new Error('Risposta illeggibile dal server');
        }
      });
    }

    // Le letture si possono ripetere senza conseguenze, quindi ritentano da
    // sole: l'inciampo e' passeggero e sparisce al tentativo dopo.
    // Tetti CRESCENTI, non un unico tetto lungo.
    //
    // Da quando il backend tiene in cache i totali per foglio, una risposta
    // buona arriva in 1,2-1,6 secondi. Se non arriva entro pochi secondi vuol
    // dire che Apps Script sta inciampando, e restare in attesa mezzo minuto e'
    // tempo buttato: conviene mollare presto e riprovare. Con il tetto unico da
    // 50 s la prima schermata restava sui puntini anche 30 secondi buoni, ed e'
    // esattamente il "ci mette troppo" che si vedeva.
    // L'ultimo tentativo resta generoso per il caso in cui il calcolo sia
    // davvero freddo e stia solo macinando.
    // Il primo tetto deve stare COMODAMENTE sopra il tempo di una risposta
    // buona, non appena sopra. Con 7 s e una lettura che ne impiega 4-6, bastava
    // una richiesta gia' in coda per farlo scadere, e il ritentativo non
    // annullava la prima: se ne aggiungeva una seconda, che si accodava alla
    // prima e peggiorava proprio la congestione che aveva causato il ritardo.
    // Tre tentativi diventavano tre richieste tutte in fila.
    var TETTI_MS = [20000, 45000];
    var PAUSE_MS = [2000];

    function apiGet(url, tentativo) {
      tentativo = tentativo || 0;
      var ctrl = window.AbortController ? new AbortController() : null;
      var scaduto = setTimeout(function () { if (ctrl) ctrl.abort(); },
        TETTI_MS[tentativo] || 45000);
      return fetch(url, ctrl ? { signal: ctrl.signal } : undefined)
        .then(leggiRisposta)
        .then(function (j) { clearTimeout(scaduto); return j; })
        .catch(function (e) {
          clearTimeout(scaduto);
          if (tentativo >= TETTI_MS.length - 1) throw e;
          // Una pausa ci vuole comunque: quando risponde con una pagina invece
          // dei dati e' perche' e' congestionato, e ributtarsi subito peggiora
          // la coda. Ma breve, altrimenti si somma all'attesa gia' spesa.
          return new Promise(function (ok) { setTimeout(ok, PAUSE_MS[tentativo] || 3000); })
            .then(function () { return apiGet(url, tentativo + 1); });
        });
    }

    // Le scritture NON ritentano mai da sole. La richiesta potrebbe essere
    // arrivata comunque, e un secondo invio scriverebbe la spesa due volte:
    // e' esattamente cosi' che e' nato un doppione sul foglio. Chi chiama deve
    // verificare sul foglio, non reinviare.
    //
    // Ma un tetto di attesa ci vuole lo stesso. Senza, una richiesta che si
    // pianta lascia la promessa mai risolta e il pulsante resta su
    // "Salvataggio…" per sempre: e' successo davvero. Allo scadere si fallisce,
    // e chi chiama va a controllare sul foglio se la scrittura era passata
    // (verificaSpesaScritta), che e' l'unico modo sicuro di uscire dal dubbio
    // senza rischiare un doppione.
    //
    // Il tetto va tarato sull'ATTESA IN CODA, non sulla durata della scrittura.
    //
    // La scrittura da sola si chiude in un paio di secondi (v25 in poi). Con
    // quel numero in testa era stato messo a 15 s, ed e' stato un errore: Apps
    // Script serializza le esecuzioni, quindi una scrittura puo' restare ferma
    // dietro una lettura da 4-6 s, a volte dietro due. A 15 s scadeva e usciva
    // "risposta non valida" su una spesa che invece era stata scritta.
    //
    // Peggio: interrompere la fetch NON ferma l'esecuzione su Apps Script.
    // La richiesta scaduta continua a occupare la coda, quindi un tetto troppo
    // corto non libera niente, produce solo un falso allarme.
    //
    // 30 s e' scelto per stare sopra la coda peggiore vista (due letture piu'
    // la scrittura), restando comunque un limite: serve solo a non lasciare il
    // pulsante bloccato per sempre se la richiesta si pianta davvero.
    var TETTO_POST_MS = 30000;

    function apiPost(corpo) {
      var ctrl = window.AbortController ? new AbortController() : null;
      var scaduto = setTimeout(function () { if (ctrl) ctrl.abort(); }, TETTO_POST_MS);
      var opzioni = {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(corpo)
      };
      if (ctrl) opzioni.signal = ctrl.signal;
      return fetch(API, opzioni)
        .then(leggiRisposta)
        .then(function (j) { clearTimeout(scaduto); return j; })
        .catch(function (e) { clearTimeout(scaduto); throw e; });
    }

    function initSeg(id, onPick) {
      var box = document.getElementById(id);
      box.addEventListener('click', function (ev) {
        var b = ev.target.closest('button'); if (!b) return;
        [].forEach.call(box.children, function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        onPick(b.getAttribute('data-v'));
      });
    }
    // Cambiare persona o conto ridisegna e basta: i quattro totali sono gia'
    // arrivati con l'unica lettura di ?action=debiti. Qui c'era una richiesta al
    // backend per ogni tocco, ed e' quello che rendeva lento passare da un tab
    // all'altro (soprattutto sull'euro, i due fogli piu' grossi).
    function cambiaTab() {
      // L'esito di un "Saldato" riguarda il foglio su cui e' stato premuto:
      // lasciarlo in piedi cambiando tab lo farebbe leggere come se riguardasse
      // quello nuovo.
      document.getElementById('saldaMsg').textContent = '';
      caricaCategorie();
      mostraDebito();
    }
    initSeg('persona', function (v) { persona = v; cambiaTab(); });
    initSeg('conto', function (v) {
      conto = v;
      document.getElementById('labImporto').textContent = 'Importo (' + (v === 'Euro' ? '€' : 'CHF') + ')';
      cambiaTab();
    });

    document.getElementById('check').addEventListener('click', function () {
      segno = !segno;
      var b = document.getElementById('checkBox');
      b.classList.toggle('on', segno);
      b.textContent = segno ? '✓' : '';
    });

    var catReq = 0; // token: solo l'ultima richiesta puo' scrivere nella select
    var catLetti = {}; // gid gia' chiesti in questa sessione

    function caricaCategorie() {
      var sel = document.getElementById('categoria');
      var mio = ++catReq;
      var mioGid = gid();

      // Si mostra SUBITO l'elenco conosciuto e la rete serve solo ad
      // aggiornarlo. Senza categorie non si puo' inserire niente, quindi farle
      // dipendere da una risposta di Apps Script (che sotto carico risponde con
      // pagine di errore) rendeva il form inutilizzabile per minuti interi.
      var note = categorieNote();
      if (note.length) riempiCategorie(sel, note);
      else sel.innerHTML = '<option value="">Caricamento…</option>';

      // Un foglio si chiede UNA volta per sessione. Prima partiva una richiesta
      // a ogni tocco su Persona o Conto, per un elenco che non cambia mai: sono
      // richieste che si mettono in coda davanti a quella che conta, e Apps
      // Script serializza, quindi rallentavano l'inserimento di una spesa.
      if (catLetti[mioGid]) return;
      catLetti[mioGid] = true;

      apiGet(API + '?action=categorie&gid=' + mioGid)
        .then(function (j) {
          // Una risposta senza ok non e' un elenco vuoto: e' un errore, e va
          // trattata come tale o la select resta muta senza spiegazione.
          if (!j || !j.ok) throw new Error('risposta non valida');
          if (mio !== catReq) return;
          var cats = j.categorie || [];
          if (cats.length) salvaCategorie(cats);
          var tutte = categorieNote();
          if (tutte.length) riempiCategorie(sel, tutte);
          else sel.innerHTML = '<option value="">(nessuna categoria)</option>';
        })
        .catch(function () {
          // Non riuscita: si toglie il segno, cosi' il prossimo passaggio su
          // questo foglio riprova invece di restare senza elenco per sempre.
          delete catLetti[mioGid];
          if (mio !== catReq) return;
          // Con un elenco gia' noto non si segnala niente: si puo' inserire lo
          // stesso, e le categorie non cambiano quasi mai.
          if (categorieNote().length) return;
          sel.innerHTML = '<option value="">(errore, tocca per riprovare)</option>';
        });
    }

    // Mantiene la scelta corrente se e' ancora fra le opzioni: ricaricare la
    // lista mentre stai compilando non deve spostarti la categoria scelta.
    function riempiCategorie(sel, cats) {
      var prima = sel.value;
      sel.innerHTML = '';
      cats.forEach(function (c) {
        var o = document.createElement('option');
        o.value = c; o.textContent = c; sel.appendChild(o);
      });
      if (prima && cats.indexOf(prima) >= 0) sel.value = prima;
    }

    // UN SOLO elenco, non uno per foglio.
    //
    // `?action=categorie` restituisce solo le categorie GIA' USATE in quel tab,
    // quindi su Riccardo franchi non compariva "Abbigliamento" per il semplice
    // motivo che li' non era mai stata usata: un cerchio chiuso, perche' senza
    // la voce nell'elenco la prima spesa non la puoi nemmeno inserire.
    // Tenendo l'unione di tutto quello che si e' visto sui quattro fogli, ogni
    // categoria resta scegliibile ovunque e non "sparisce" cambiando conto.
    var CHIAVE_CAT = 'rmoney_categorie';

    function categorieNote() {
      try {
        var v = JSON.parse(localStorage.getItem(CHIAVE_CAT) || '[]');
        return (v && v.length) ? v : [];
      } catch (e) { return []; }
    }

    function salvaCategorie(cats) {
      try {
        var unione = categorieNote();
        cats.forEach(function (c) {
          c = String(c).trim();
          if (c && unione.indexOf(c) < 0) unione.push(c);
        });
        unione.sort(function (a, b) { return a.localeCompare(b, 'it'); });
        localStorage.setItem(CHIAVE_CAT, JSON.stringify(unione));
      } catch (e) { /* spazio pieno o modalita' privata: pazienza */ }
    }

    caricaCategorie();

    // Rete tornata, o inciampo passeggero: toccare la select riprova.
    document.getElementById('categoria').addEventListener('focus', function () {
      var o = this.options[0];
      if (this.options.length === 1 && o && o.value === '' && /errore/.test(o.textContent)) {
        caricaCategorie();
      }
    });

    // ---- Debito condiviso (righe con la spunta split) ----
    // Nessun helper che legga persona/conto globali: il rendering deve usare
    // solo la fotografia presa quando la richiesta e' partita (vedi caricaDebito).
    // Una richiesta sola porta i totali di TUTTI E QUATTRO i fogli
    // (?action=debiti). Cambiare persona o conto non fa piu' partire niente:
    // il numero e' gia' arrivato.
    //
    // Non e' una cache. I quattro totali sono letti dal foglio nello stesso
    // istante, non vengono salvati da nessuna parte e non sopravvivono alla
    // chiusura della pagina. Prima invece ogni cambio di tab costava un giro
    // completo sul backend, e se il precedente era ancora in volo si accodavano:
    // Apps Script serializza le richieste dello stesso utente, quindi la seconda
    // aspettava la prima e a volte scadeva. Sul telefono si e' visto anche
    // peggio, con la lettura dell'euro fallita due volte di fila mentre la
    // pagina caricava le sue.
    var fogliDebito = null;  // ultimo giro di letture, solo in memoria

    // Rende la card con quello che c'e', senza toccare la rete.
    function mostraDebito() {
      var foglioLbl = document.getElementById('debtFoglioLbl');
      var foglioVal = document.getElementById('debtFoglioVal');
      var netLbl = document.getElementById('debtNetLbl');
      var netVal = document.getElementById('debtNetVal');
      var saldaBtn = document.getElementById('saldaBtn');

      var altra = persona === 'Riccardo' ? 'Roberta' : 'Riccardo';
      var simb = conto === 'Euro' ? '€' : 'CHF';

      foglioLbl.textContent = altra + ' deve a ' + persona;
      netLbl.textContent = 'Saldo netto ' + conto;
      saldaBtn.textContent = 'Saldato · azzera split ' + persona + ' ' + conto;
      // Il messaggio del "Saldato" NON si tocca qui: questa funzione gira anche
      // quando la lettura finisce, e cancellerebbe l'esito appena scritto
      // ("Azzerate N spunte") un attimo dopo averlo mostrato.

      // Finche' non sono arrivati i numeri non si salda: azzerare le spunte
      // senza aver visto il totale vero sarebbe irreversibile alla cieca.
      if (!fogliDebito) {
        saldaBtn.disabled = true;
        foglioVal.textContent = '…'; foglioVal.className = 'debtVal';
        netVal.textContent = '…'; netVal.className = 'debtVal';
        return;
      }
      if (fogliDebito === 'errore') {
        saldaBtn.disabled = true;
        foglioVal.textContent = 'non caricato, riprova';
        foglioVal.className = 'debtVal zero';
        netVal.textContent = '';
        return;
      }

      var mio = fogliDebito[TABS[persona][conto]] || { meta: 0 };
      var suo = fogliDebito[TABS[altra][conto]] || { meta: 0 };
      saldaBtn.disabled = false;

      // Meta condivisa di questo foglio (quanto l'altra persona deve).
      if (mio.meta > 0.005) {
        foglioVal.textContent = fmtImporto(mio.meta, simb);
        foglioVal.className = 'debtVal';
      } else {
        foglioVal.textContent = 'nessuna spesa condivisa';
        foglioVal.className = 'debtVal zero';
      }

      // Saldo netto per valuta: meta(mio) - meta(partner).
      var netto = mio.meta - suo.meta;
      var abs = Math.abs(netto);
      if (abs < 0.005) {
        netVal.textContent = 'in pari';
        netVal.className = 'debtVal zero';
      } else {
        var chi = netto > 0 ? altra : persona;
        var aChi = netto > 0 ? persona : altra;
        netLbl.textContent = chi + ' deve a ' + aChi + ' (' + conto + ')';
        netVal.textContent = fmtImporto(abs, simb);
        netVal.className = 'debtVal';
      }
    }

    // La pagina su GitHub Pages e il backend su Apps Script non cambiano nello
    // stesso istante: la pagina resta in cache una decina di minuti, e il
    // backend si aggiorna a mano. Quindi una versione nuova della pagina puo'
    // benissimo trovarsi davanti un backend vecchio. Se non conosce
    // ?action=debiti risponde con il suo JSON informativo, senza "fogli": in
    // quel caso si ripiega sulle due letture per valuta, che esistono da
    // sempre. Senza questo la card resterebbe su "non caricato" fino al deploy.
    function leggiTuttiIDebiti() {
      return apiGet(API + '?action=debiti').then(function (j) {
        if (j && j.fogli) return j.fogli;
        return leggiDebitiPerValuta();
      });
    }

    function leggiDebitiPerValuta() {
      var fogli = {};
      // In sequenza, mai insieme: Apps Script serializza le richieste dello
      // stesso utente e lanciarle in parallelo le fa scadere a vicenda.
      return ['Euro', 'Franchi'].reduce(function (prima, c) {
        return prima.then(function () {
          return apiGet(API + '?action=debito&gid=' + TABS.Riccardo[c]
            + '&gidPartner=' + TABS.Roberta[c])
            .then(function (j) {
              var d = j && j.debito;
              if (!d || !d.mio) throw new Error('risposta senza il debito');
              fogli[TABS.Riccardo[c]] = d.mio;
              fogli[TABS.Roberta[c]] = d.partner;
            });
        });
      }, Promise.resolve()).then(function () { return fogli; });
    }

    // Rilegge i quattro totali dal foglio. Da chiamare all'avvio e dopo ogni
    // scrittura che tocca le spunte, non a ogni cambio di tab.
    var debitoReq = 0; // token: solo l'ultima lettura puo' scrivere il risultato

    function caricaDebito() {
      var mio = ++debitoReq;
      fogliDebito = null;
      document.getElementById('saldaMsg').textContent = '';
      mostraDebito();
      return leggiTuttiIDebiti()
        .then(function (fogli) {
          if (mio !== debitoReq) return; // superata da una lettura piu' recente
          fogliDebito = fogli;
          mostraDebito();
        })
        .catch(function () {
          if (mio !== debitoReq) return;
          // Meglio dire che non si sa, che mostrare un numero di ieri: su questo
          // numero si decide chi paga, e uno sbagliato e' peggio di nessuno.
          fogliDebito = 'errore';
          mostraDebito();
        });
    }

    // Qui c'era una cache del debito in localStorage, una per ognuna delle
    // quattro combinazioni persona/conto, piu' un precaricamento in sottofondo
    // delle altre tre dopo la prima lettura riuscita.
    //
    // Tolta apposta, e non va rimessa. Serviva a coprire un backend che
    // impiegava decine di secondi, ma una volta scritta una combinazione non
    // veniva piu' aggiornata finche' non la si guardava, quindi ogni
    // dispositivo conservava la fotografia del momento in cui l'aveva aperta e
    // i tre mostravano tre numeri diversi. Il precaricamento per giunta
    // sparava tre richieste in piu' a ogni prima apertura, e Apps Script
    // serializza le richieste dello stesso utente: contribuiva alla lentezza
    // che la cache doveva mascherare.
    //
    // Il totale ora arriva dal foglio a ogni lettura (backend v27, che legge
    // solo le colonne importo e spunta). Se serve renderlo piu' veloce, si
    // legge di meno, non si conserva di piu'.
    // Ripulisce le chiavi lasciate dalle versioni precedenti: senza, restano
    // in localStorage per sempre senza che nessuno le legga.
    (function scartaVecchiaCacheDebito() {
      try {
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (k && k.indexOf('rmoney_debito_') === 0) localStorage.removeItem(k);
        }
      } catch (e) { /* modalita' privata: pazienza */ }
    })();

    caricaDebito();

    // Pulsante di annullamento, mostrato solo dopo un azzeramento riuscito.
    // Il backend ricorda quali righe erano spuntate, quindi rimetterle e' una
    // sola chiamata. Resta disponibile finche' non si ricarica la pagina: un
    // errore lo si nota subito, e piu' tardi sarebbe rischioso rimettere spunte
    // su righe che nel frattempo possono essere cambiate.
    function mostraAnnulla(gidFatto, quante) {
      var m = document.getElementById('saldaMsg');
      var b = document.createElement('button');
      b.className = 'saldaBtn';
      b.textContent = '↩ Annulla: rimetti le ' + quante + ' spunte';
      b.addEventListener('click', function () {
        b.disabled = true;
        m.className = 'saldaMsg'; m.textContent = 'Ripristino…';
        apiPost({ op: 'annullaSalda', gid: gidFatto })
          .then(function (j) {
            if (j && j.ok) {
              m.className = 'saldaMsg ok';
              m.textContent = '✓ Rimesse ' + (j.rimesse || 0) + ' spunte';
              b.remove();
              caricaDebito();
            } else {
              m.className = 'saldaMsg err';
              m.textContent = 'Errore: ' + ((j && j.error) || 'sconosciuto');
              b.disabled = false;
            }
          })
          .catch(function () {
            m.className = 'saldaMsg err';
            m.textContent = 'Rete non raggiungibile, riprova';
            b.disabled = false;
          });
      });
      m.parentNode.insertBefore(b, m.nextSibling);
    }

    // Bottone "saldato": azzera le spunte split del SOLO foglio selezionato.
    document.getElementById('saldaBtn').addEventListener('click', function () {
      var m = document.getElementById('saldaMsg');
      // La conferma dice QUANTO si sta per azzerare, non solo che si sta per
      // fare qualcosa: un "sei sicuro?" generico si accetta per riflesso, un
      // numero davanti agli occhi no. E' gia' successo di perdere 29 spunte.
      var quante = document.getElementById('debtFoglioVal').textContent;
      var ok = confirm('Azzerare le spunte "split" di ' + persona + ' ' + conto + '?\n\n'
        + 'Riguarda ' + quante + ' di spese condivise.\n\n'
        + 'Le spese restano nel foglio: vengono tolte solo le spunte, quindi non '
        + 'saranno più conteggiate come condivise. Dopo avrai un pulsante per annullare.');
      if (!ok) return;
      var btn = this;
      btn.disabled = true; m.className = 'saldaMsg'; m.textContent = 'Azzeramento…';
      apiPost({ op: 'salda', gid: gid() })
        .then(function (j) {
          if (j && j.ok) {
            var gidFatto = gid();
            caricaDebito(); // ricalcola prima (azzera saldaMsg internamente)
            m.className = 'saldaMsg ok'; m.textContent = '✓ Azzerate ' + (j.azzerate || 0) + ' spunte';
            if (j.annullabile) mostraAnnulla(gidFatto, j.azzerate || 0);
          } else {
            m.className = 'saldaMsg err'; m.textContent = 'Errore: ' + ((j && j.error) || 'sconosciuto');
          }
          btn.disabled = false;
        })
        .catch(function () {
          // Una fetch fallita non dice se il foglio sia stato toccato o no.
          // Invece di lasciare il dubbio, ricontrolliamo il totale reale: se e'
          // ancora diverso da zero l'azzeramento non e' passato e si puo' riprovare.
          m.className = 'saldaMsg'; m.textContent = 'Errore di rete, verifico…';
          apiGet(API + '?action=debito&gid=' + gid())
            .then(function (j) {
              var d = j && j.debito && j.debito.mio;
              if (d && d.conteggio === 0) {
                m.className = 'saldaMsg ok'; m.textContent = '✓ Era comunque andata a buon fine';
              } else {
                m.className = 'saldaMsg err';
                m.textContent = 'Non azzerato (' + (d ? d.conteggio : '?') + ' spunte ancora attive), riprova';
              }
              caricaDebito();
            })
            .catch(function () {
              m.className = 'saldaMsg err'; m.textContent = 'Rete non raggiungibile, riprova';
            });
          btn.disabled = false;
        });
    });

    document.getElementById('btn').addEventListener('click', function () {
      var msg = document.getElementById('msg');
      var btn = document.getElementById('btn');
      var spesa = document.getElementById('spesa').value.trim();
      if (!spesa) { msg.className = 'err'; msg.textContent = 'Inserisci un importo.'; return; }
      if (isNaN(parseFloat(spesa.replace(',', '.')))) {
        msg.className = 'err'; msg.textContent = 'Importo non valido.'; return;
      }
      // Le categorie arrivano da Apps Script e possono metterci diversi secondi:
      // senza questo controllo un invio anticipato scriveva una categoria vuota.
      if (!document.getElementById('categoria').value) {
        msg.className = 'err'; msg.textContent = 'Attendi il caricamento delle categorie.'; return;
      }

      var dati = {
        gid: gid(),
        data: document.getElementById('data').value,
        spesa: spesa,
        categoria: document.getElementById('categoria').value,
        nota: document.getElementById('nota').value,
        segno: segno
      };

      btn.disabled = true; msg.className = ''; msg.textContent = 'Salvataggio…';
      apiPost(dati)
        .then(function (j) {
          if (j && j.ok) {
            msg.className = 'ok'; msg.textContent = '✓ Spesa aggiunta al foglio!';
            document.getElementById('spesa').value = '';
            document.getElementById('nota').value = '';
            segno = false;
            document.getElementById('checkBox').classList.remove('on');
            document.getElementById('checkBox').textContent = '';
            if (dati.segno) caricaDebito(); // spesa condivisa: aggiorna il totale
          } else {
            msg.className = 'err'; msg.textContent = 'Errore: ' + ((j && j.error) || 'sconosciuto');
          }
          btn.disabled = false;
        })
        .catch(function () {
          // Qui NON si puo' ripetere la POST alla cieca: la richiesta potrebbe
          // essere arrivata e la riga essere gia' sul foglio, e un secondo
          // invio scriverebbe la spesa due volte. Si va invece a guardare se
          // c'e'. Casi tipici: Apps Script che risponde con una pagina HTML al
          // posto del JSON (su Safari l'errore e' l'incomprensibile "The string
          // did not match the expected pattern"), oppure la rete caduta a meta'.
          // Il testo dice cosa sta succedendo, non che qualcosa e' andato
          // storto: nella maggior parte dei casi la spesa e' sul foglio ed e'
          // solo la risposta a essersi persa. "Risposta non valida" faceva
          // pensare a un errore di salvataggio che quasi mai c'era stato.
          msg.className = ''; msg.textContent = 'Verifico sul foglio…';
          verificaSpesaScritta(dati, function (errore, trovata) {
            if (errore) {
              msg.className = 'err';
              msg.textContent = 'Non riesco a verificare. Guarda il foglio prima di riprovare, '
                + 'per non inserirla due volte.';
            } else if (trovata) {
              msg.className = 'ok'; msg.textContent = '✓ Era comunque andata a buon fine';
              document.getElementById('spesa').value = '';
              document.getElementById('nota').value = '';
              segno = false;
              document.getElementById('checkBox').classList.remove('on');
              document.getElementById('checkBox').textContent = '';
              if (dati.segno) caricaDebito();
            } else {
              msg.className = 'err';
              msg.textContent = 'Non salvata, premi di nuovo Aggiungi.';
            }
            btn.disabled = false;
          });
        });
    });

    // La spesa appena inviata e' finita sul foglio, si' o no?
    //
    // Serve a distinguere "non e' passata" da "e' passata ma la risposta si e'
    // persa", che a schermo sono identiche e portano al doppio inserimento.
    // Il secondo caso e' di gran lunga il piu' frequente: la scrittura dentro
    // Apps Script dura 1-2 secondi ed e' quasi sempre andata a buon fine, e'
    // il ritiro della risposta da Google che ogni tanto torna come pagina di
    // errore. Per questo la verifica deve essere rapida e non fallire quasi
    // mai, altrimenti si finisce per dire "non riesco a verificare" su una
    // spesa che c'e'.
    //
    // Chiede a ?action=cerca, che guarda solo la coda del foglio e due colonne.
    // Prima usava ?action=spese, che ricalcola un mese intero su due fogli:
    // l'endpoint piu' pesante, chiesto nel momento peggiore.
    // Due tentativi, perche' un fallimento qui lascia l'utente nel dubbio.
    function verificaSpesaScritta(dati, cb, tentativo) {
      tentativo = tentativo || 0;
      var url = API + '?action=cerca&gid=' + dati.gid
        + '&importo=' + encodeURIComponent(String(dati.spesa).replace(',', '.'))
        + '&nota=' + encodeURIComponent(String(dati.nota || '').trim());

      var ctrlV = window.AbortController ? new AbortController() : null;
      var scadutoV = setTimeout(function () { if (ctrlV) ctrlV.abort(); }, 15000);
      fetch(url, ctrlV ? { signal: ctrlV.signal } : undefined)
        .then(leggiRisposta)
        .then(function (j) {
          clearTimeout(scadutoV);
          if (!j || !j.ok || typeof j.trovata !== 'boolean') {
            throw new Error('risposta non valida');
          }
          cb(null, j.trovata);
        })
        .catch(function (e) {
          clearTimeout(scadutoV);
          if (tentativo >= 1) { cb(e); return; }
          setTimeout(function () { verificaSpesaScritta(dati, cb, tentativo + 1); }, 2000);
        });
    }

    // ==================== Riepilogo ====================
    var riepP = 'Annuale', riepC = 'Euro';
    var charts = {}; // istanze Chart.js, per distruggerle prima di ricrearle
    var riepReq = 0; // token per ignorare risposte fuori ordine (race condition)
    var riepData = null; // ultima risposta, per ridisegnare senza rifare la fetch
    var catChi = 'Insieme'; // filtro persona della sezione "Spese per categoria"

    // Popola il selettore anno (dal 2024 all'anno corrente) e il mese corrente.
    (function initPeriodo() {
      var annoSel = document.getElementById('riepAnno');
      var ora = new Date();
      for (var y = ora.getFullYear(); y >= 2024; y--) {
        var o = document.createElement('option');
        o.value = y; o.textContent = y; annoSel.appendChild(o);
      }
      annoSel.value = ora.getFullYear();
      document.getElementById('riepMese').value =
        ora.getFullYear() + '-' + String(ora.getMonth() + 1).padStart(2, '0');
    })();

    function esc(s) {
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function riepSimbolo() { return riepC === 'Euro' ? '€' : 'CHF'; }

    // Un solo formato per gli importi in tutta l'app. Prima la card del debito e
    // la conferma di eliminazione ne usavano uno proprio, senza separatore delle
    // migliaia, quindi lo stesso numero si leggeva "1165,86" li' e "1.165,86"
    // nel riepilogo e nel dettaglio.
    function fmtImporto(n, simb) {
      var s = Math.abs(n).toLocaleString('it-IT',
        { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return (simb ? simb + ' ' : '') + s;
    }

    function riepFmt(n) {
      return (n < 0 ? '-' : '') + fmtImporto(n, riepSimbolo());
    }
    function chartTextColor() {
      return getComputedStyle(document.body).getPropertyValue('--text').trim() || '#333';
    }
    function gridColor() {
      return getComputedStyle(document.body).getPropertyValue('--border').trim() || '#ccc';
    }
    // Palette per categorie/serie.
    var PAL = ['#2563eb', '#ec4899', '#16a34a', '#f59e0b', '#8b5cf6', '#06b6d4',
               '#ef4444', '#10b981', '#f97316', '#6366f1'];

    function destroyChart(k) { if (charts[k]) { charts[k].destroy(); charts[k] = null; } }

    document.getElementById('topToggle').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      [].forEach.call(this.children, function (c) { c.classList.remove('on'); });
      b.classList.add('on');
      var v = b.getAttribute('data-v');
      // Il dettaglio e' una terza vista senza pulsante: si chiude sempre quando
      // si usa il selettore in cima.
      document.getElementById('viewDettaglio').style.display = 'none';
      document.getElementById('viewInserisci').style.display = v === 'inserisci' ? '' : 'none';
      document.getElementById('viewRiepilogo').style.display = v === 'riepilogo' ? '' : 'none';
      if (v === 'riepilogo') caricaRiepilogo();
    });

    initSeg('riepPeriodo', function (v) {
      riepP = v;
      var an = v === 'Annuale';
      document.getElementById('wrapAnno').style.display = an ? '' : 'none';
      document.getElementById('wrapMese').style.display = an ? 'none' : '';
      caricaRiepilogo();
    });
    initSeg('riepValuta', function (v) { riepC = v; caricaRiepilogo(); });
    initSeg('catChi', function (v) { catChi = v; renderCategorie(); });
    document.getElementById('riepAnno').addEventListener('change', caricaRiepilogo);
    document.getElementById('riepMese').addEventListener('change', caricaRiepilogo);

    function caricaRiepilogo() {
      var m = document.getElementById('riepMsg');
      m.className = ''; m.textContent = 'Caricamento…';
      var myReq = ++riepReq; // solo l'ultima richiesta puo' renderizzare
      var url = API + '?action=riep&conto=' + riepC + '&tipo=' + (riepP === 'Annuale' ? 'annuale' : 'mensile');
      if (riepP === 'Annuale') {
        url += '&anno=' + document.getElementById('riepAnno').value;
      } else {
        var mm = (document.getElementById('riepMese').value || '').split('-');
        url += '&anno=' + (mm[0] || '') + '&mese=' + (parseInt(mm[1], 10) || '');
      }
      apiGet(url)
        .then(function (j) {
          if (myReq !== riepReq) return; // risposta superata da una piu' recente
          var d = j && j.riepilogo;
          if (!d) { m.className = 'err'; m.textContent = 'Nessun dato.'; return; }
          m.textContent = '';
          renderRiepilogo(d);
        })
        .catch(function (e) {
          if (myReq !== riepReq) return;
          m.className = 'err'; m.textContent = 'Errore di rete: ' + e.message;
        });
    }

    function renderRiepilogo(d) {
      riepData = d;
      var per = d.periodo || {};
      document.getElementById('riepPeriodoLbl').textContent =
        (per.inizio ? per.inizio : '') + (per.fine ? ' → ' + per.fine : '');

      var ov = d.overview || { entrate: 0, uscite: 0, totale: 0 };
      var e = d.entrate || {}, s = d.risparmio || {};

      // Tabella overview: Entrate / Uscite / Risparmio per Riccardo, Roberta, Combo.
      // Uscite = entrate - risparmio (stessa logica delle barre).
      function setCell(id, val, colora) {
        var el = document.getElementById(id);
        el.textContent = riepFmt(val);
        el.className = colora ? (val < 0 ? 'neg' : 'pos') : '';
      }
      setCell('ovEntrRicc', e.riccardo || 0);
      setCell('ovEntrRob', e.roberta || 0);
      setCell('ovEntrTot', ov.entrate);
      setCell('ovUscRicc', (e.riccardo || 0) - (s.riccardo || 0));
      setCell('ovUscRob', (e.roberta || 0) - (s.roberta || 0));
      setCell('ovUscTot', ov.uscite);
      setCell('ovRispRicc', s.riccardo || 0, true);
      setCell('ovRispRob', s.roberta || 0, true);
      setCell('ovRispTot', ov.totale, true);

      var txt = chartTextColor(), grid = gridColor();
      Chart.defaults.color = txt;
      Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;

      // --- Donut per persona: spese vs entrate (Roberta, Riccardo, Totale) ---
      function donut(id, valsId, spese, entrate) {
        destroyChart(id);
        charts[id] = new Chart(document.getElementById(id), {
          type: 'doughnut',
          data: { labels: ['Spese', 'Entrate'], datasets: [{ data: [spese, entrate], backgroundColor: ['#ec4899', '#16a34a'], borderWidth: 0 }] },
          options: { plugins: { legend: { display: false }, tooltip: { enabled: false } }, cutout: '55%' }
        });
        // Valori sempre visibili sotto la torta (i numeri CHF sono troppo grandi
        // per un tooltip su un canvas cosi' piccolo).
        document.getElementById(valsId).innerHTML =
          '<div><span class="dot s"></span>' + riepFmt(spese) + '</div>' +
          '<div><span class="dot e"></span>' + riepFmt(entrate) + '</div>';
      }
      donut('chDonutRob', 'valsRob', (e.roberta || 0) - (s.roberta || 0), e.roberta || 0);
      donut('chDonutRicc', 'valsRicc', (e.riccardo || 0) - (s.riccardo || 0), e.riccardo || 0);
      donut('chDonutTot', 'valsTot', ov.uscite, ov.entrate);

      // --- Barre: entrate / risparmio / spese per persona ---
      var persone = ['Roberta', 'Riccardo', 'Totale'];
      var kEntr = [e.roberta || 0, e.riccardo || 0, e.totale || 0];
      var kRisp = [s.roberta || 0, s.riccardo || 0, s.totale || 0];
      var kSpese = kEntr.map(function (x, i) { return x - kRisp[i]; });
      destroyChart('bar');
      charts.bar = new Chart(document.getElementById('chBar'), {
        type: 'bar',
        data: {
          labels: persone,
          datasets: [
            { label: 'Entrate', data: kEntr, backgroundColor: '#16a34a' },
            { label: 'Spese', data: kSpese, backgroundColor: '#ec4899' },
            { label: 'Risparmio', data: kRisp, backgroundColor: '#2563eb' }
          ]
        },
        options: {
          plugins: {
            legend: { position: 'bottom' },
            tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + riepFmt(c.raw); } } }
          },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { color: grid }, ticks: { callback: function (v) { return v; } } }
          }
        }
      });

      // --- Linea: andamento risparmio mensile (solo annuale) ---
      var cardAnd = document.getElementById('cardAndamento');
      if (d.andamento && d.andamento.mesi && d.andamento.mesi.length) {
        cardAnd.style.display = '';
        var a = d.andamento;
        destroyChart('line');
        charts.line = new Chart(document.getElementById('chLine'), {
          type: 'line',
          data: {
            labels: a.mesi,
            datasets: [
              { label: 'Roberta', data: a.roberta, borderColor: '#8b5cf6', backgroundColor: '#8b5cf6', tension: .3, pointRadius: 2 },
              { label: 'Riccardo', data: a.riccardo, borderColor: '#16a34a', backgroundColor: '#16a34a', tension: .3, pointRadius: 2 },
              { label: 'Totale', data: a.totale, borderColor: '#ec4899', backgroundColor: '#ec4899', tension: .3, pointRadius: 2 }
            ]
          },
          options: {
            plugins: {
              legend: { position: 'bottom' },
              tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + riepFmt(c.raw); } } }
            },
            scales: {
              x: { grid: { display: false }, ticks: { maxRotation: 90, minRotation: 45, font: { size: 9 } } },
              y: { grid: { color: grid }, ticks: { callback: function (v) { return v; } } }
            }
          }
        });
      } else {
        cardAnd.style.display = 'none';
        destroyChart('line');
      }

      renderCategorie();
    }

    // --- Spese per categoria, filtrabili per persona (Insieme/Riccardo/Roberta).
    // Periodo e valuta arrivano dai selettori in cima; i dati sono gia' quelli
    // dell'ultima risposta, quindi cambiare persona non rifa' la fetch.
    function renderCategorie() {
      if (!riepData) return;
      var grid = gridColor();
      var spR = (riepData.spese && riepData.spese.roberta) || [];
      var spI = (riepData.spese && riepData.spese.riccardo) || [];
      function valFor(list, cat) {
        for (var i = 0; i < list.length; i++) if (list[i].categoria === cat) return list[i].importo;
        return 0;
      }
      // Unione delle categorie viste da entrambi, poi righe con i tre valori.
      var nomi = [];
      spI.forEach(function (x) { if (nomi.indexOf(x.categoria) < 0) nomi.push(x.categoria); });
      spR.forEach(function (x) { if (nomi.indexOf(x.categoria) < 0) nomi.push(x.categoria); });
      var righe = nomi.map(function (c) {
        var ri = valFor(spI, c), ro = valFor(spR, c);
        return { cat: c, ricc: ri, rob: ro, tot: ri + ro };
      });
      // Valore su cui filtrare/ordinare secondo la persona scelta.
      function valore(r) {
        return catChi === 'Riccardo' ? r.ricc : catChi === 'Roberta' ? r.rob : r.tot;
      }
      righe = righe.filter(function (r) { return Math.abs(valore(r)) > 0.005; });
      righe.sort(function (a, b) { return valore(b) - valore(a); });

      var tbl = document.getElementById('catTable');
      var cv = document.getElementById('chCat');
      destroyChart('cat');
      if (!righe.length) {
        cv.style.display = 'none';
        tbl.innerHTML = '<tr><td class="catEmpty">Nessuna spesa in questo periodo.</td></tr>';
        return;
      }
      cv.style.display = '';
      // Altezza proporzionale al numero di categorie mostrate.
      cv.height = Math.max(160, righe.length * 26 + 70);

      var labels = righe.map(function (r) { return r.cat; });
      var datasets = catChi === 'Riccardo'
        ? [{ label: 'Riccardo', data: righe.map(function (r) { return r.ricc; }), backgroundColor: '#2563eb' }]
        : catChi === 'Roberta'
          ? [{ label: 'Roberta', data: righe.map(function (r) { return r.rob; }), backgroundColor: '#ec4899' }]
          : [
            { label: 'Riccardo', data: righe.map(function (r) { return r.ricc; }), backgroundColor: '#2563eb' },
            { label: 'Roberta', data: righe.map(function (r) { return r.rob; }), backgroundColor: '#ec4899' }
          ];
      var insieme = catChi === 'Insieme';
      charts.cat = new Chart(cv, {
        type: 'bar',
        data: { labels: labels, datasets: datasets },
        options: {
          indexAxis: 'y',
          plugins: {
            legend: { display: insieme, position: 'bottom' },
            tooltip: { callbacks: { label: function (c) { return c.dataset.label + ': ' + riepFmt(c.raw); } } }
          },
          scales: {
            // Barre impilate: nella vista Insieme la lunghezza totale e' la somma dei due.
            x: { stacked: insieme, grid: { color: grid }, ticks: { callback: function (v) { return v; } } },
            y: { stacked: insieme, grid: { display: false }, ticks: { font: { size: 11 } } }
          }
        }
      });

      // Dettaglio numerico sotto il grafico, con quota percentuale sul totale.
      var totale = righe.reduce(function (s, r) { return s + valore(r); }, 0);
      var html = '';
      righe.forEach(function (r) {
        var v = valore(r);
        var pct = totale ? Math.round(v / totale * 100) : 0;
        var sub = insieme
          ? '<span class="sub">Riccardo ' + riepFmt(r.ricc) + ' · Roberta ' + riepFmt(r.rob) + '</span>'
          : '';
        html += '<tr><td class="c">'
          + '<span class="catLink" data-cat="' + esc(r.cat) + '">' + esc(r.cat) + '</span>'
          + sub + '</td>'
          + '<td class="v">' + riepFmt(v) + '</td>'
          + '<td class="p">' + pct + '%</td></tr>';
      });
      html += '<tr class="tot"><td class="c">Totale</td>'
        + '<td class="v">' + riepFmt(totale) + '</td><td class="p"></td></tr>';
      tbl.innerHTML = html;
    }

    // ==================== Dettaglio spese di una categoria ====================
    // Terza vista, raggiungibile solo cliccando una categoria nel riepilogo.
    // Mostra le singole spese (data, nota, importo) del periodo, della valuta e
    // della persona gia' selezionati sopra.
    var detReq = 0;    // token: solo l'ultima richiesta puo' renderizzare
    var detCtx = null; // categoria + periodo + valuta fissati all'apertura
    var detChi = 'Insieme';
    var detDirty = false; // true dopo una cancellazione: il riepilogo va rifatto

    document.getElementById('catTable').addEventListener('click', function (ev) {
      var a = ev.target.closest('.catLink'); if (!a) return;
      apriDettaglio(a.getAttribute('data-cat'));
    });

    document.getElementById('detBack').addEventListener('click', function () {
      document.getElementById('viewDettaglio').style.display = 'none';
      document.getElementById('viewRiepilogo').style.display = '';
      window.scrollTo(0, 0);
      // Dopo una cancellazione i totali del riepilogo sono vecchi: vanno
      // riletti, altrimenti si torna indietro e si vede ancora la spesa tolta.
      if (detDirty) { detDirty = false; caricaRiepilogo(); }
    });

    // Eliminazione: disponibile SOLO da questa schermata, mai dal riepilogo o
    // dal form. Svuota la riga sul foglio lasciandola al suo posto.
    document.getElementById('detTable').addEventListener('click', function (ev) {
      var b = ev.target.closest('.delBtn'); if (!b) return;
      var gid = b.getAttribute('data-gid');
      var riga = b.getAttribute('data-riga');
      // Senza un foglio valido non si tocca niente: meglio fermarsi che
      // mandare al backend un gid inventato.
      if (!/^\d+$/.test(gid) || !/^\d+$/.test(riga)) {
        document.getElementById('detMsg').textContent = 'Riga non identificabile, ricarica.';
        return;
      }
      var nota = b.getAttribute('data-nota');
      var quando = b.getAttribute('data-data');
      var quanto = parseFloat(b.getAttribute('data-importo'));
      var simb = detCtx && detCtx.valuta === 'Euro' ? '€' : 'CHF';

      var ok = confirm('Eliminare questa spesa?\n\n'
        + quando + '\n' + fmtImporto(quanto, simb)
        + (nota ? '\n' + nota : '') + '\n\n'
        + 'La riga ' + riga + ' del foglio resta al suo posto, ma vuota.');
      if (!ok) return;

      var m = document.getElementById('detMsg');
      b.disabled = true;
      m.textContent = 'Eliminazione…';
      apiPost({
          op: 'elimina',
          gid: gid,
          riga: riga,
          // Il backend rifiuta se la riga nel frattempo e' cambiata.
          atteso: { importo: quanto, nota: nota, categoria: detCtx ? detCtx.cat : '' }
        })
        .then(function (j) {
          if (j && j.ok) {
            detDirty = true;
            caricaDettaglio(); // rilegge la lista e il totale dal foglio
          } else {
            b.disabled = false;
            m.textContent = 'Errore: ' + ((j && j.error) || 'sconosciuto');
          }
        })
        .catch(function (e) {
          b.disabled = false;
          m.textContent = 'Errore di rete: ' + e.message;
        });
    });

    // Il filtro persona vive anche qui: dalla lista si passa da Insieme al
    // singolo senza tornare indietro. Cambia solo la persona, non il periodo.
    initSeg('detChi', function (v) { detChi = v; caricaDettaglio(); });

    function apriDettaglio(cat) {
      document.getElementById('viewRiepilogo').style.display = 'none';
      document.getElementById('viewDettaglio').style.display = '';
      window.scrollTo(0, 0);

      // Fotografia dei filtri al momento del click: da qui in poi il dettaglio
      // vive di vita propria e non rilegge piu' le variabili del riepilogo.
      var mm = (document.getElementById('riepMese').value || '').split('-');
      detCtx = {
        cat: cat,
        valuta: riepC,
        tipo: riepP === 'Annuale' ? 'annuale' : 'mensile',
        anno: riepP === 'Annuale' ? document.getElementById('riepAnno').value : (mm[0] || ''),
        mese: riepP === 'Annuale' ? '' : (parseInt(mm[1], 10) || '')
      };

      // Parte dalla stessa persona scelta nel riepilogo.
      detChi = catChi;
      [].forEach.call(document.getElementById('detChi').children, function (b) {
        b.classList.toggle('on', b.getAttribute('data-v') === detChi);
      });

      document.getElementById('detTitle').textContent = cat;
      caricaDettaglio();
    }

    function caricaDettaglio() {
      if (!detCtx) return;
      var myReq = ++detReq;
      var c = detCtx, chiReq = detChi;
      var simbReq = c.valuta === 'Euro' ? '€' : 'CHF';
      function fmtReq(n) {
        return fmtImporto(n, simbReq);
      }

      var url = API + '?action=spese&conto=' + c.valuta + '&tipo=' + c.tipo
        + '&anno=' + c.anno + (c.mese ? '&mese=' + c.mese : '')
        + '&persona=' + encodeURIComponent(chiReq)
        + '&categoria=' + encodeURIComponent(c.cat);

      document.getElementById('detSub').textContent =
        chiReq + ' · ' + c.tipo + ' · ' + c.valuta;
      document.getElementById('detTable').innerHTML = '';
      document.getElementById('detHint').textContent = '';
      var m = document.getElementById('detMsg');
      m.textContent = 'Caricamento…';

      apiGet(url)
        .then(function (j) {
          if (myReq !== detReq) return; // risposta superata da una piu' recente
          var d = j && j.spese;
          if (!d) {
            // Il backend risponde ma senza questo endpoint: quasi sempre e' una
            // pagina vecchia in cache che punta a una distribuzione precedente.
            // Dirlo esplicitamente evita di scambiarlo per "non ci sono spese".
            m.textContent = j && j.version
              ? 'Backend ' + j.version + ' senza elenco spese: ricarica la pagina.'
              : 'Nessun dato.';
            return;
          }
          var righe = d.righe || [];
          document.getElementById('detSub').textContent =
            chiReq + ' · ' + (d.periodo ? d.periodo.inizio + ' → ' + d.periodo.fine : '')
            + ' · ' + c.valuta;
          if (!righe.length) {
            m.textContent = 'Nessuna spesa in questa categoria.';
            return;
          }
          m.textContent = '';
          var html = '';
          righe.forEach(function (r) {
            // Nella vista Insieme serve sapere di chi e' la spesa.
            var chi = chiReq === 'Insieme'
              ? '<span class="chi">' + esc(r.persona) + '</span>' : '';
            var nota = r.nota ? '<span class="nota">' + esc(r.nota) + '</span>' : '';
            // I dati della riga viaggiano con il bottone: servono al backend
            // per ricontrollare di star svuotando davvero questa spesa.
            // Il foglio si ricava da persona + valuta con la mappa TABS: non
            // dipende da cosa manda il backend, quindi non puo' arrivare vuoto.
            var gidRiga = (TABS[r.persona] || {})[c.valuta];
            html += '<tr><td class="d">' + esc(r.data) + chi + nota + '</td>'
              + '<td class="v">' + fmtReq(r.importo) + '</td>'
              + '<td class="x"><button class="delBtn" title="Elimina questa spesa"'
              + ' data-gid="' + gidRiga + '" data-riga="' + r.riga + '"'
              + ' data-importo="' + r.importo + '"'
              + ' data-nota="' + esc(r.nota || '') + '"'
              + ' data-data="' + esc(r.data) + '">×</button></td></tr>';
          });
          html += '<tr class="tot"><td class="d">Totale · ' + righe.length + ' spese</td>'
            + '<td class="v">' + fmtReq(d.totale || 0) + '</td><td class="x"></td></tr>';
          document.getElementById('detTable').innerHTML = html;
          document.getElementById('detHint').textContent =
            'La × elimina la spesa dal foglio: la riga resta al suo posto, vuota.';
        })
        .catch(function (e) {
          if (myReq !== detReq) return;
          m.textContent = 'Errore di rete: ' + e.message;
        });
    }
  </script>
</body>
</html>
