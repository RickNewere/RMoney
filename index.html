<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>RMoney</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e3a8a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RMoney">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <style>
    :root {
      --bg:#f2f4f7; --card:#ffffff; --field:#ffffff; --border:#cfd4dc;
      --text:#1a1a1a; --muted:#6b7280; --accent:#2563eb; --accentDim:#9db8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#0f1115; --card:#1a1d24; --field:#262a33; --border:#3a3f4b;
        --text:#f2f4f7; --muted:#9aa3b2; --accent:#3b82f6; --accentDim:#28466f;
      }
    }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; background:var(--bg); }
    body {
      font-family:-apple-system, system-ui, Roboto, Arial, sans-serif;
      color:var(--text); padding:max(16px, env(safe-area-inset-top)) 14px 40px;
    }
    .brand { text-align:center; font-size:28px; font-weight:800; margin:12px 0 18px; }
    .card { max-width:480px; margin:0 auto; background:var(--card); border-radius:20px; padding:18px; }
    label { display:block; font-size:13px; font-weight:700; color:var(--muted); margin:16px 0 6px; }
    input, select {
      width:100%; font-size:17px; padding:13px 12px; border:1px solid var(--border);
      border-radius:12px; background:var(--field); color:var(--text); appearance:none; -webkit-appearance:none;
    }
    textarea {
      width:100%; font-size:17px; padding:13px 12px; border:1px solid var(--border);
      border-radius:12px; background:var(--field); color:var(--text); min-height:70px; resize:vertical;
    }
    .seg { display:flex; gap:8px; }
    .seg button {
      flex:1; padding:12px; border-radius:12px; border:1px solid var(--border);
      background:transparent; color:var(--text); font-size:16px; font-weight:700;
    }
    .seg button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
    .check { display:flex; align-items:center; margin-top:20px; }
    .check .box {
      width:26px; height:26px; border-radius:7px; border:2px solid var(--border);
      margin-right:12px; display:flex; align-items:center; justify-content:center;
      color:#fff; font-weight:900; font-size:17px;
    }
    .check .box.on { background:var(--accent); border-color:var(--accent); }
    .check span { font-size:15px; font-weight:600; }
    #btn {
      width:100%; margin-top:22px; padding:16px; border:none; border-radius:14px;
      background:var(--accent); color:#fff; font-size:18px; font-weight:800;
    }
    #btn:disabled { background:var(--accentDim); }
    #msg { text-align:center; margin-top:16px; font-weight:700; min-height:22px; font-size:15px; }
    .ok { color:#16a34a; } .err { color:#dc2626; }
    .debt { padding:14px 18px; margin-bottom:14px; }
    .debtTitle { font-size:12px; font-weight:800; color:var(--muted); margin-bottom:10px; text-transform:uppercase; letter-spacing:.5px; }
    .debtRow { display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:6px 0; }
    .debtRow.net { border-top:1px solid var(--border); margin-top:4px; padding-top:12px; }
    .debtLbl { font-size:14px; color:var(--text); }
    .debtVal { font-size:17px; font-weight:800; color:var(--accent); white-space:nowrap; }
    .debtVal.zero { color:var(--muted); font-weight:600; font-size:14px; }
    /* Marker next to the title: says whether the figure on screen is being
       refreshed or is stale, without ever blanking the figure itself. */
    .debtStato { font-size:11px; font-weight:600; color:var(--muted); margin-left:8px; }
    /* Riga di stato del collegamento Google. Volutamente discreta: e' una cosa
       che si tocca una volta e poi si dimentica. */
    .gRiga { display:flex; align-items:center; justify-content:space-between;
             gap:10px; max-width:480px; margin:0 auto 14px; padding:0 4px; }
    .gStato { font-size:11px; font-weight:600; color:var(--muted); }
    .gCollega { font-size:12px; font-weight:700; padding:6px 12px; border-radius:8px;
                border:1px solid var(--border); background:transparent;
                color:var(--accent); cursor:pointer; white-space:nowrap; }
    .gCollega[hidden] { display:none; }
    .saldaBtn { width:100%; margin-top:14px; padding:11px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:14px; font-weight:700; }
    .saldaBtn:disabled { opacity:.5; }
    .saldaMsg { text-align:center; margin-top:8px; font-size:13px; font-weight:600; min-height:16px; }
    .topToggle { max-width:480px; margin:0 auto 14px; }
    .periodLbl { text-align:center; font-size:13px; color:var(--muted); margin-top:12px; }
    .ovGrid { display:flex; gap:10px; }
    .ovCell { flex:1; text-align:center; padding:10px 6px; border:1px solid var(--border); border-radius:12px; }
    .ovLbl { font-size:11px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
    .ovVal { font-size:16px; font-weight:800; margin-top:4px; white-space:nowrap; }
    .ovVal.pos { color:#16a34a; } .ovVal.neg { color:#dc2626; }
    .ovTable { width:100%; border-collapse:collapse; font-size:12px; }
    .ovTable th, .ovTable td { padding:8px 3px; text-align:right; white-space:nowrap; }
    .ovTable thead th { font-size:10px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
    .ovTable tbody th { text-align:left; font-weight:800; font-size:13px; padding-right:8px; }
    .ovTable tbody tr + tr th, .ovTable tbody tr + tr td { border-top:1px solid var(--border); }
    .ovTable tr.combo th, .ovTable tr.combo td { font-weight:800; }
    .ovTable td.pos { color:#16a34a; } .ovTable td.neg { color:#dc2626; }
    .secTitle { font-size:12px; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; }
    .card + .card { margin-top:14px; }
    canvas { max-width:100%; }
    .donutRow { display:flex; gap:6px; margin-top:16px; }
    .donutCell { flex:1; min-width:0; text-align:center; }
    .donutTit { font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; }
    .donutLegend { text-align:center; margin-top:12px; font-size:12px; color:var(--muted); }
    .donutLegend .dl { display:inline-block; width:10px; height:10px; border-radius:2px; margin:0 4px 0 10px; vertical-align:middle; }
    .donutLegend .dl.s { background:#ec4899; } .donutLegend .dl.e { background:#16a34a; }
    .donutVals { margin-top:8px; font-size:11px; line-height:1.6; }
    .donutVals div { white-space:nowrap; }
    .donutVals .dot { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }
    .donutVals .dot.s { background:#ec4899; } .donutVals .dot.e { background:#16a34a; }
    #riepMsg { text-align:center; margin-top:14px; font-weight:700; min-height:22px; font-size:15px; }
    #catChi { margin-bottom:16px; }
    #catChi button { padding:9px 4px; font-size:14px; }
    .catTable { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
    .catTable td { padding:7px 2px; border-top:1px solid var(--border); vertical-align:middle; }
    .catTable td.c { text-align:left; font-weight:600; }
    .catTable td.v { text-align:right; font-weight:700; white-space:nowrap; }
    .catTable td.p { text-align:right; color:var(--muted); width:38px; white-space:nowrap; }
    .catTable .sub { display:block; font-size:10px; font-weight:500; color:var(--muted); margin-top:2px; }
    .catTable tr.tot td { border-top:2px solid var(--border); font-weight:800; font-size:13px; }
    .catEmpty { text-align:center; color:var(--muted); font-size:13px; padding:18px 0; }
    .catLink { color:var(--accent); text-decoration:underline; cursor:pointer; }
    /* Sticky in cima: dalle liste lunghe si torna indietro senza risalire. */
    .backBtn {
      display:block; max-width:480px; margin:0 auto 14px; width:100%;
      position:sticky; top:0; z-index:5;
      padding:13px; border-radius:14px; border:1px solid var(--border);
      background:var(--card); color:var(--accent); font-size:16px; font-weight:800; text-align:left;
    }
    .detTitle { font-size:20px; font-weight:800; margin:0 0 4px; }
    .detSub { font-size:13px; color:var(--muted); margin-bottom:16px; }
    #detChi button { padding:9px 4px; font-size:14px; }
    .detTable { width:100%; border-collapse:collapse; font-size:13px; margin-top:6px; }
    .detTable td { padding:10px 2px; border-top:1px solid var(--border); vertical-align:top; }
    .detTable td.d { text-align:left; }
    .detTable td.v { text-align:right; font-weight:800; white-space:nowrap; padding-left:10px; }
    .detTable .nota { display:block; font-size:12px; color:var(--muted); margin-top:3px; }
    .detTable .chi { display:inline-block; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.3px; color:var(--muted); margin-left:6px; }
    .detTable tr.tot td { border-top:2px solid var(--border); font-weight:800; font-size:14px; }
    .detTable td.x { width:34px; text-align:right; padding-left:6px; }
    .delBtn {
      width:30px; height:30px; border-radius:9px; border:1px solid var(--border);
      background:transparent; color:#dc2626; font-size:16px; font-weight:800; line-height:1; padding:0;
    }
    .delBtn:disabled { opacity:.4; }
    .detHint { font-size:11px; color:var(--muted); margin-top:10px; line-height:1.5; }
  </style>
</head>
<body>
  <div class="brand">💸 RMoney</div>

  <div class="seg topToggle" id="topToggle">
    <button data-v="inserisci" class="on">Inserisci</button>
    <button data-v="riepilogo">Riepilogo</button>
  </div>

  <div id="viewInserisci">
  <div class="card debt" id="debt">
    <div class="debtTitle">Debito condiviso<span class="debtStato" id="debtStato"></span></div>
    <div class="debtRow">
      <span class="debtLbl" id="debtFoglioLbl">Dal foglio</span>
      <span class="debtVal" id="debtFoglioVal">…</span>
    </div>
    <div class="debtRow net">
      <span class="debtLbl" id="debtNetLbl">Saldo netto</span>
      <span class="debtVal" id="debtNetVal">…</span>
    </div>
    <button id="saldaBtn" class="saldaBtn">Segna come saldato</button>
    <div id="saldaMsg" class="saldaMsg"></div>
  </div>

  <div class="gRiga">
    <span id="gStato" class="gStato">Salvataggio tramite Apps Script</span>
    <button id="gCollega" class="gCollega">Collega Google</button>
  </div>

  <div class="card">
    <label>Persona</label>
    <div class="seg" id="persona">
      <button data-v="Riccardo" class="on">Riccardo</button>
      <button data-v="Roberta">Roberta</button>
    </div>

    <label>Conto</label>
    <div class="seg" id="conto">
      <button data-v="Euro" class="on">Euro</button>
      <button data-v="Franchi">Franchi</button>
    </div>

    <label>Data</label>
    <input type="date" id="data">

    <label id="labImporto">Importo (€)</label>
    <input type="text" id="spesa" inputmode="decimal" autocomplete="off" placeholder="0,00">

    <label>Categoria</label>
    <select id="categoria"><option>Caricamento…</option></select>

    <label>Nota</label>
    <textarea id="nota" placeholder="Facoltativa"></textarea>

    <div class="check" id="check">
      <div class="box" id="checkBox"></div>
      <span>Spesa condivisa (dividi a metà)</span>
    </div>

    <button id="btn">Aggiungi spesa</button>
    <div id="msg"></div>
  </div>
  </div><!-- /viewInserisci -->

  <div id="viewRiepilogo" style="display:none">
    <div class="card">
      <label>Periodo</label>
      <div class="seg" id="riepPeriodo">
        <button data-v="Annuale" class="on">Annuale</button>
        <button data-v="Mensile">Mensile</button>
      </div>
      <label>Valuta</label>
      <div class="seg" id="riepValuta">
        <button data-v="Euro" class="on">Euro</button>
        <button data-v="Franchi">Franchi</button>
      </div>

      <div id="wrapAnno">
        <label>Anno</label>
        <select id="riepAnno"></select>
      </div>
      <div id="wrapMese" style="display:none">
        <label>Mese</label>
        <input type="month" id="riepMese">
      </div>

      <div class="periodLbl" id="riepPeriodoLbl"></div>
    </div>

    <div class="card">
      <table class="ovTable">
        <thead>
          <tr><th></th><th>Entrate</th><th>Uscite</th><th>Risparmio</th></tr>
        </thead>
        <tbody>
          <tr>
            <th>Riccardo</th>
            <td id="ovEntrRicc">…</td><td id="ovUscRicc">…</td><td id="ovRispRicc">…</td>
          </tr>
          <tr>
            <th>Roberta</th>
            <td id="ovEntrRob">…</td><td id="ovUscRob">…</td><td id="ovRispRob">…</td>
          </tr>
          <tr class="combo">
            <th>Combo</th>
            <td id="ovEntrTot">…</td><td id="ovUscTot">…</td><td id="ovRispTot">…</td>
          </tr>
        </tbody>
      </table>
      <div class="donutRow">
        <div class="donutCell"><div class="donutTit">Roberta</div><canvas id="chDonutRob"></canvas><div class="donutVals" id="valsRob"></div></div>
        <div class="donutCell"><div class="donutTit">Riccardo</div><canvas id="chDonutRicc"></canvas><div class="donutVals" id="valsRicc"></div></div>
        <div class="donutCell"><div class="donutTit">Totale</div><canvas id="chDonutTot"></canvas><div class="donutVals" id="valsTot"></div></div>
      </div>
      <div class="donutLegend"><span class="dl s"></span>Spese <span class="dl e"></span>Entrate</div>
    </div>

    <div class="card">
      <div class="secTitle">Entrate · Risparmio · Spese</div>
      <canvas id="chBar" height="200"></canvas>
    </div>

    <div class="card" id="cardAndamento">
      <div class="secTitle">Andamento risparmio mensile</div>
      <canvas id="chLine" height="230"></canvas>
    </div>

    <div class="card">
      <div class="secTitle">Spese per categoria</div>
      <div class="seg" id="catChi">
        <button data-v="Insieme" class="on">Insieme</button>
        <button data-v="Riccardo">Riccardo</button>
        <button data-v="Roberta">Roberta</button>
      </div>
      <canvas id="chCat" height="420"></canvas>
      <table class="catTable" id="catTable"></table>
    </div>

    <div id="riepMsg"></div>
  </div><!-- /viewRiepilogo -->

  <div id="viewDettaglio" style="display:none">
    <button class="backBtn" id="detBack">← Torna al riepilogo</button>
    <div class="card">
      <div class="detTitle" id="detTitle">…</div>
      <div class="detSub" id="detSub"></div>
      <div class="seg" id="detChi">
        <button data-v="Insieme" class="on">Insieme</button>
        <button data-v="Riccardo">Riccardo</button>
        <button data-v="Roberta">Roberta</button>
      </div>
      <table class="detTable" id="detTable"></table>
      <div id="detMsg" class="catEmpty"></div>
      <div class="detHint" id="detHint"></div>
    </div>
  </div><!-- /viewDettaglio -->

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    var API = 'https://script.google.com/macros/s/AKfycbzhLZJkgUw6K7Stp8nl3LdQk6-uvpwO9aHysdd7bWw_uC3QEPugp_laAsahABB6jFA1xA/exec';

    // ---- Scrittura diretta sul foglio, senza passare da Apps Script ----
    //
    // Perche' esiste: una chiamata ad Apps Script paga l'avvio di un'esecuzione
    // prima che una riga del nostro codice giri. Misurato su un comando che non
    // apre nemmeno il foglio, tre volte di fila nello stesso minuto: 1,0 s,
    // 27,6 s, 3,0 s. Quel numero non si accorcia dal client, si evita.
    // L'API di Sheets non ha esecuzioni da avviare: si parla col foglio.
    //
    // L'ID client sta qui in chiaro apposta ed e' cosi' che va usato: e' un
    // identificativo pubblico, non una password. Cio' che protegge e' la lista
    // delle origini autorizzate sul progetto Google, che accetta richieste solo
    // da https://ricknewere.github.io e da localhost:8099. Il "client secret"
    // che Google mostra alla creazione NON serve a questo tipo di accesso e non
    // va messo qui: se un giorno finisse in questo file, andrebbe revocato.
    var CLIENT_ID = '502850989113-r5c4n6ce133m9pdrmpvn0otrh9oo4qsr.apps.googleusercontent.com';
    var AMBITO_SHEETS = 'https://www.googleapis.com/auth/spreadsheets';
    var FOGLIO_ID = '10NT_nAkXRX12sEzFdpa6khSnONfjwm-NHGguoDm215U';
    // Prima riga che l'app puo' riordinare per data, per foglio. E' la copia
    // esatta di SORT_FROM in backend/Codice.gs e va tenuta identica: se i due
    // valori divergono, i due percorsi di scrittura ordinano porzioni diverse
    // dello stesso foglio.
    //
    // Questi numeri sono stati fissati il 27/07/2026 all'ultima riga allora
    // presente piu' uno: tutto quello che c'era prima resta dov'e' per sempre.
    // NON ricalcolarli e non "semplificarli": abbassarli rimescola lo storico
    // di due anni di spese, alzarli perde l'ordinamento gia' fatto.
    var CODA_DA = {
      113020932: 775,   // LOG RICCARDO
      1888286288: 565,  // LOG ROBERTA
      650699013: 105,   // LOG RICCARDO CHF
      1063479927: 106   // LOG ROBERTA CHF
    };

    // ---------- Accesso Google ----------
    // Il permesso dura circa un'ora e non si rinnova da solo in modo davvero
    // silenzioso: Google puo' voler aprire una finestrella, e un browser la
    // blocca se non nasce da un tocco dell'utente. Per questo non si insiste
    // mai: se il token non c'e' o e' scaduto, il salvataggio prende la strada
    // di Apps Script, che funziona sempre. Nessuno resta senza salvare.
    var tokenGoogle = '';
    var tokenScade = 0;
    var CHIAVE_COLLEGATO = 'rmoney_google_collegato';
    var CHIAVE_TOKEN = 'rmoney_google_token';

    // Il permesso dura un'ora, ma prima si perdeva a ogni riapertura della
    // pagina, e la web app sull'iPhone si ricarica di continuo: in pratica
    // dell'ora se ne usavano pochi minuti, e tutto il resto tornava su Apps
    // Script. Conservandolo, l'ora si usa tutta.
    //
    // E' un gettone di accesso, quindi va detto cosa si sta conservando: vale
    // solo per i fogli di calcolo di chi lo ha rilasciato, scade da solo in
    // un'ora e resta nel telefono, leggibile solo da questa stessa pagina.
    // Non e' una password e non permette di rientrare nell'account.
    function salvaToken() {
      try {
        localStorage.setItem(CHIAVE_TOKEN, JSON.stringify({ t: tokenGoogle, s: tokenScade }));
      } catch (e) { /* modalita' privata: pazienza, si ricollega */ }
    }
    function scartaToken() {
      tokenGoogle = ''; tokenScade = 0;
      try { localStorage.removeItem(CHIAVE_TOKEN); } catch (e) { /* pazienza */ }
    }
    (function riprendiToken() {
      try {
        var g = JSON.parse(localStorage.getItem(CHIAVE_TOKEN) || 'null');
        if (g && g.t && g.s > Date.now()) { tokenGoogle = g.t; tokenScade = g.s; }
        else if (g) { localStorage.removeItem(CHIAVE_TOKEN); }
      } catch (e) { /* niente da riprendere */ }
    })();

    function googleCaricato() {
      return !!(window.google && google.accounts && google.accounts.oauth2);
    }
    function tokenValido() { return !!tokenGoogle && Date.now() < tokenScade; }
    function haGiaCollegato() {
      try { return localStorage.getItem(CHIAVE_COLLEGATO) === '1'; } catch (e) { return false; }
    }

    // ---------- L'accesso resta ----------
    // Il permesso che Google da' a una pagina dura un'ora e non si rinnova da
    // solo: misurato, anche partendo da un tocco dell'utente il rinnovo
    // silenzioso vuole aprire una finestra e non si chiude mai. Quindi l'ora
    // scadeva e si tornava su Apps Script, cioe' sui 27 secondi.
    //
    // La soluzione e' l'altro tipo di accesso, quello "offline": Google
    // consegna, oltre al permesso di un'ora, un GETTONE DI RINNOVO che non
    // scade. Con quello il telefono si rifa' il permesso da solo, in sottofondo,
    // per sempre. Accesso una volta e basta.
    //
    // Il gettone di rinnovo si ottiene solo scambiando un codice con la chiave
    // segreta del client, e quella chiave non puo' stare in questa pagina che e'
    // pubblica: la custodisce Apps Script (v34, op oauthScambia e oauthRinnova).
    // Il gettone pero' resta QUI, nel telefono, non sul backend: se lo tenesse
    // il backend, l'indirizzo pubblico dell'app diventerebbe una porta che
    // consegna a chiunque l'accesso a tutti i fogli del proprietario.
    var CHIAVE_RINNOVO = 'rmoney_google_rinnovo';
    var clientCodice = null;

    function gettoneRinnovo() {
      try { return localStorage.getItem(CHIAVE_RINNOVO) || ''; } catch (e) { return ''; }
    }

    function accettaAccesso(accesso, durataSec) {
      tokenGoogle = accesso;
      // durata in secondi, meno un minuto di margine: una richiesta lunga non
      // deve partire con un permesso che scade a meta' strada.
      tokenScade = Date.now() + (Number(durataSec || 3600) - 60) * 1000;

      programmaRinnovo();

    // Primo accesso, e l'unico momento in cui l'utente vede qualcosa di Google.
    function collegaGoogle() {
      return new Promise(function (ok, no) {
        if (!googleCaricato()) { no(new Error('Google non caricato')); return; }
        if (!clientCodice) {
          clientCodice = google.accounts.oauth2.initCodeClient({
            client_id: CLIENT_ID,
            scope: AMBITO_SHEETS,
            ux_mode: 'popup',
            callback: function (r) {
              if (!r || !r.code) { no(new Error((r && r.error) || 'accesso negato')); return; }
              // Il codice va al custode della chiave, che lo scambia.
              apiPost({ op: 'oauthScambia', codice: r.code })
                .then(function (j) {
                  if (!j || !j.ok || !j.accesso) {
                    throw new Error((j && j.error) || 'scambio non riuscito');
                  }
                  if (j.rinnovo) {

                    // l'utente deve ridare il consenso da capo.
                    try { localStorage.setItem(CHIAVE_RINNOVO, j.rinnovo); } catch (e) { /* privata */ }
                  }
                  accettaAccesso(j.accesso, j.durata);

                .catch(no);

    // Rinnovo: nessuna finestra, nessun tocco. Una chiamata sola, una volta
    // all'ora, e mai mentre l'utente sta aspettando un salvataggio.
    var rinnovoInCorso = null;

      if (rinnovoInCorso) return rinnovoInCorso;
      var r = gettoneRinnovo();
      if (!r) return Promise.reject(new Error('nessun gettone di rinnovo'));
      rinnovoInCorso = apiPost({ op: 'oauthRinnova', rinnovo: r })
        .then(function (j) {
          rinnovoInCorso = null;
          if (!j || !j.ok || !j.accesso) throw new Error((j && j.error) || 'rinnovo non riuscito');
          accettaAccesso(j.accesso, j.durata);
          mostraStatoGoogle();
          return tokenGoogle;
        })
        .catch(function (e) {
          rinnovoInCorso = null;
          // invalid_grant: il consenso e' stato revocato dall'account Google.
          // Il gettone non tornera' mai piu' buono, si butta e si richiede
          // l'accesso, invece di riprovare all'infinito con qualcosa di morto.
          if (/invalid_grant|revok/i.test(e.message || '')) {

    // che un salvataggio trovi il permesso morto e debba ripiegare.
    var timerRinnovo = null;
    function programmaRinnovo() {
      if (timerRinnovo) clearTimeout(timerRinnovo);
      if (!gettoneRinnovo()) return;
      var fra = Math.max(30000, tokenScade - Date.now() - 300000);
      timerRinnovo = setTimeout(function () {
        rinnovaToken().catch(function () { /* riprova il prossimo giro */ });
      }, fra);

    // ---------- Chiamate all'API di Sheets ----------
    var API_SHEETS = 'https://sheets.googleapis.com/v4/spreadsheets/';

    function chiamaSheets(url, opzioni) {
      opzioni = opzioni || {};
      opzioni.headers = opzioni.headers || {};
      opzioni.headers['Authorization'] = 'Bearer ' + tokenGoogle;
      return fetch(url, opzioni).then(function (r) {
        return r.text().then(function (t) {
          var j = null;
          try { j = JSON.parse(t); } catch (e) { /* errore non JSON */ }
          if (!r.ok) {
            var e2 = new Error((j && j.error && j.error.message) || ('HTTP ' + r.status));
            e2.stato = r.status;
            throw e2;
          }
          return j;
        });
      });
    }

    // A1 vuole le lettere di colonna, la griglia vuole gli indici: servono
    // entrambe perche' la lettura e' per intervallo e la scrittura per griglia.
    function lettereColonna(n) { // 1 -> A
      var s = '';
      while (n > 0) { var r = (n - 1) % 26; s = String.fromCharCode(65 + r) + s; n = (n - 1 - r) / 26; }
      return s;
    }

    // Titolo e numero di righe fisiche del foglio, per gid. Letti una volta per
    // sessione: sono le uniche cose che servono e che non cambiano mai.
    var metaFogli = {};
    function metaFoglio(gid) {
      if (metaFogli[gid]) return Promise.resolve(metaFogli[gid]);
      var url = API_SHEETS + FOGLIO_ID
        + '?fields=' + encodeURIComponent('sheets(properties(sheetId,title,gridProperties(rowCount,columnCount)))');
      return chiamaSheets(url).then(function (j) {
        (j.sheets || []).forEach(function (s) {
          var p = s.properties || {};
          var g = p.gridProperties || {};
          metaFogli[p.sheetId] = {
            titolo: p.title, righe: g.rowCount || 1000, colonne: g.columnCount || 26
          };
        });
        if (!metaFogli[gid]) throw new Error('foglio ' + gid + ' non trovato');
        return metaFogli[gid];
      });
    }

    // ---------- Algoritmo di inserimento ----------
    // Copia fedele della meta' in memoria di aggiungiSpesa in Codice.gs. E'
    // verificata da 38 prove offline, e ogni scostamento da quel file e' una
    // riga sbagliata su un foglio che due persone usano per dividere i soldi.

    // Numero seriale di Google Sheets per una data yyyy-mm-dd, a mezzogiorno.
    // Mezzogiorno e non mezzanotte per lo stesso motivo per cui il backend usa
    // T12:00:00: lascia mezza giornata di margine da entrambe le parti, cosi'
    // nessun fuso puo' far scivolare il valore al giorno prima o dopo.
    function serialeData(iso) {
      var p = String(iso).split('-');
      return Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000 + 25569 + 0.5;
    }

    function cellaTesto(v) { return (v === undefined || v === null) ? '' : String(v); }

    // Una riga e' vuota se non ha ne' data, ne' importo, ne' categoria, ne'
    // nota. La colonna della spunta non conta: una casella superstite su una
    // riga senza spesa e' un residuo, non un dato.
    function rigaVuota(row, idx) {
      return [idx.data, idx.spesa, idx.cat, idx.nota].every(function (k) {
        return k < 0 || cellaTesto(row[k]).trim() === '';
      });
    }

    // Letta con UNFORMATTED_VALUE, una data vera e' gia' un numero. Tutto il
    // resto non e' una data su cui si possa ordinare.
    function dataRiga(row, idxData) {
      if (idxData < 0) return null;
      var v = row[idxData];
      return (typeof v === 'number' && isFinite(v)) ? v : null;
    }

    function trovaColonna(intestazioni, possibili) {
      for (var i = 0; i < intestazioni.length; i++) {
        for (var j = 0; j < possibili.length; j++) {
          if (intestazioni[i].indexOf(possibili[j]) !== -1) return i;
        }
      }
      return -1;
    }

    // Stessa euristica di _findHeader: la riga di intestazione e' quella che
    // contiene piu' parole note, cercata nelle prime otto.
    function trovaIntestazioni(blocco, lastCol) {
      var kw = ['data', 'categor', 'dettagl', 'importo', 'spesa', 'euro',
                'costo', '€', 'chf', 'franc', 'note', 'nota', 'descriz'];
      var best = -1, bestRiga = 1, bestInt = [];
      for (var r = 0; r < blocco.length; r++) {
        var riga = [];
        for (var c = 0; c < lastCol; c++) riga.push(cellaTesto(blocco[r][c]).toLowerCase().trim());
        var punti = 0;
        riga.forEach(function (cella) {
          if (!cella) return;
          kw.forEach(function (k) { if (cella.indexOf(k) !== -1) punti++; });
        });
        if (punti > best) { best = punti; bestRiga = r + 1; bestInt = riga; }
      }
      return { riga: bestRiga, intestazioni: bestInt };
    }

    function componiRiga(dati, idx, lastCol) {
      var riga = new Array(lastCol);
      for (var i = 0; i < lastCol; i++) riga[i] = '';
      if (idx.data >= 0) riga[idx.data] = dati.seriale;
      if (idx.spesa >= 0) riga[idx.spesa] = dati.importo;
      if (idx.cat >= 0) riga[idx.cat] = dati.categoria || '';
      if (idx.nota >= 0) riga[idx.nota] = dati.nota || '';
      if (idx.split >= 0) {
        riga[idx.split] = !!dati.segno;
      } else if (dati.segno && idx.nota >= 0) {
        // Fogli senza colonna split: vale ancora il vecchio marcatore.
        var cDx = idx.nota + 1;
        while (riga.length <= cDx) riga.push('');
        riga[cDx] = '-';
      }
      while (riga.length < lastCol) riga.push('');
      return riga.slice(0, lastCol);
    }

    function calcolaScrittura(o) {
      var piene = [], ultimoPieno = -1, i;
      for (i = 0; i < o.coda.length; i++) {
        if (rigaVuota(o.coda[i], o.idx)) continue;
        piene.push(o.coda[i]);
        ultimoPieno = i;
      }
      // La coda e' tenuta in ordine di data, quindi basta la prima con data
      // maggiore. Le date uguali restano dietro a quelle gia' presenti, cosi'
      // l'ultima inserita e' l'ultima in basso.
      var p = piene.length, mia = o.riga[o.idx.data];
      for (var k = 0; k < piene.length; k++) {
        var d = dataRiga(piene[k], o.idx.data);
        if (d !== null && d > mia) { p = k; break; }
      }
      piene.splice(p, 0, o.riga);
      // Prima riga che cambia davvero: se sopra al punto di inserimento c'era
      // un buco, la compattazione sposta tutto e bisogna partire da li'.
      // Il confronto e' per riferimento: piene contiene gli array di coda.
      var inizio = p;
      for (var q = 0; q < p; q++) { if (piene[q] !== o.coda[q]) { inizio = q; break; } }
      var ultima = o.da + piene.length - 1;
      return {
        inizio: inizio,
        quante: piene.length - inizio,
        rigaNuova: o.da + p,
        ultima: ultima,
        valori: piene.slice(inizio),
        primaRigaScritta: o.da + inizio,
        righeDaAggiungere: ultima > o.righeFisiche ? ultima - o.righeFisiche : 0,
        nasceRigaNuova: ultima > o.ultimaUsata,
        avanzo: Math.max(0, ultimoPieno - piene.length + 1)
      };
    }

    // ---------- La scrittura vera ----------
    // Due chiamate in tutto: una legge intestazioni e coda insieme, una scrive
    // valori, formato e casella insieme. Apps Script ne faceva una sola, ma
    // pagando ogni volta l'avvio di un'esecuzione, che e' la cosa che costa.

    function cellaDaValore(v) {
      if (v === '' || v === undefined || v === null) return {}; // svuota
      if (typeof v === 'number') return { userEnteredValue: { numberValue: v } };
      if (typeof v === 'boolean') return { userEnteredValue: { boolValue: v } };
      return { userEnteredValue: { stringValue: String(v) } };
    }

    function scriviDiretto(dati) {
      var gid = parseInt(dati.gid, 10);
      var da = CODA_DA[gid];
      if (!da) return Promise.reject(new Error('foglio senza riga di partenza'));
      var t0 = Date.now();
      var meta;
      var inviata = false; // la richiesta di scrittura e' gia' partita?

      return metaFoglio(gid).then(function (m) {
        meta = m;
        var ultimaCol = lettereColonna(meta.colonne);
        var t = "'" + String(meta.titolo).replace(/'/g, "''") + "'";
        // Un solo giro per le intestazioni (prime 8 righe) e per la coda.
        // La coda si chiede aperta in fondo: Google restituisce solo le righe
        // che esistono davvero, e da quante sono si ricava l'ultima occupata.
        var url = API_SHEETS + FOGLIO_ID + '/values:batchGet'
          + '?valueRenderOption=UNFORMATTED_VALUE&dateTimeRenderOption=SERIAL_NUMBER'
          + '&ranges=' + encodeURIComponent(t + '!A1:' + ultimaCol + '8')
          + '&ranges=' + encodeURIComponent(t + '!A' + da + ':' + ultimaCol);
        return chiamaSheets(url);
      }).then(function (j) {
        var v = j.valueRanges || [];
        var blocco = (v[0] && v[0].values) || [];
        var coda = (v[1] && v[1].values) || [];
        var lastCol = meta.colonne;

        var h = trovaIntestazioni(blocco, lastCol);
        var idx = {
          data:  trovaColonna(h.intestazioni, ['data']),
          spesa: trovaColonna(h.intestazioni, ['€', 'chf', 'importo', 'spesa', 'euro', 'franc', 'costo']),
          cat:   trovaColonna(h.intestazioni, ['categor']),
          nota:  trovaColonna(h.intestazioni, ['dettagl', 'nota', 'note', 'descriz']),
          split: trovaColonna(h.intestazioni, ['split'])
        };
        if (idx.spesa < 0 && idx.data >= 0) idx.spesa = idx.data + 1;
        if (idx.data < 0 || idx.spesa < 0) {
          throw new Error('intestazioni del foglio non riconosciute');
        }

        // Google taglia le celle vuote in fondo a ogni riga: senza questo
        // pareggio, gli indici di colonna scivolerebbero.
        var i, c;
        for (i = 0; i < coda.length; i++) {
          while (coda[i].length < lastCol) coda[i].push('');
        }

        var importo = parseFloat(String(dati.spesa).replace(',', '.'));
        if (isNaN(importo)) throw new Error('Importo non valido.');
        var riga = componiRiga({
          seriale: serialeData(dati.data), importo: importo,
          categoria: dati.categoria, nota: dati.nota, segno: dati.segno
        }, idx, lastCol);

        var piano = calcolaScrittura({
          coda: coda, riga: riga, idx: idx, da: da,
          righeFisiche: meta.righe,
          ultimaUsata: da + coda.length - 1
        });

        var req = [];
        // 1. Le righe fisiche devono esistere: scrivere fuori dalla griglia e'
        //    un errore, non una crescita automatica.
        if (piano.righeDaAggiungere > 0) {
          req.push({ appendDimension: {
            sheetId: gid, dimension: 'ROWS', length: piano.righeDaAggiungere
          } });
        }
        // 2. Formato della riga che nasce ora, copiato dalla PRIMA riga di
        //    dati e non dall'ultima: se le ultime sono gia' venute male,
        //    copiare da li' propagherebbe il difetto.
        if (piano.nasceRigaNuova) {
          req.push({ copyPaste: {
            source: { sheetId: gid, startRowIndex: h.riga, endRowIndex: h.riga + 1,
                      startColumnIndex: 0, endColumnIndex: lastCol },
            destination: { sheetId: gid, startRowIndex: piano.ultima - 1, endRowIndex: piano.ultima,
                           startColumnIndex: 0, endColumnIndex: lastCol },
            pasteType: 'PASTE_FORMAT'
          } });
        }
        // 3. La casella di spunta su tutto l'intervallo riscritto: una riga
        //    nata ora, o svuotata da una cancellazione, non ha la convalida, e
        //    senza convalida un true si vedrebbe come la scritta "TRUE".
        if (idx.split >= 0) {
          req.push({ setDataValidation: {
            range: { sheetId: gid,
              startRowIndex: piano.primaRigaScritta - 1,
              endRowIndex: piano.primaRigaScritta - 1 + piano.quante,
              startColumnIndex: idx.split, endColumnIndex: idx.split + 1 },
            rule: { condition: { type: 'BOOLEAN' }, showCustomUi: true }
          } });
        }
        // 4. I valori. fields limitato al contenuto: il formato delle celle
        //    gia' esistenti non si tocca.
        req.push({ updateCells: {
          range: { sheetId: gid,
            startRowIndex: piano.primaRigaScritta - 1,
            endRowIndex: piano.primaRigaScritta - 1 + piano.quante,
            startColumnIndex: 0, endColumnIndex: lastCol },
          rows: piano.valori.map(function (r) {
            return { values: r.map(cellaDaValore) };
          }),
          fields: 'userEnteredValue'
        } });
        // 5. Se la coda si e' compattata, sotto restano le copie delle righe
        //    risalite: vanno svuotate, spunta compresa.
        if (piano.avanzo > 0) {
          req.push({ updateCells: {
            range: { sheetId: gid, startRowIndex: piano.ultima, endRowIndex: piano.ultima + piano.avanzo,
                     startColumnIndex: 0, endColumnIndex: lastCol },
            fields: 'userEnteredValue'
          } });
          if (idx.split >= 0) {
            req.push({ setDataValidation: {
              range: { sheetId: gid, startRowIndex: piano.ultima, endRowIndex: piano.ultima + piano.avanzo,
                       startColumnIndex: idx.split, endColumnIndex: idx.split + 1 }
            } });
          }
        }

        // Sheets applica un batch in modo atomico: o passa tutto, o non cambia
        // niente. E' la garanzia che una riga non finisca scritta a meta'.
        //
        // Da qui in poi la richiesta di scrittura E' PARTITA, e questo cambia
        // tutto per chi gestisce l'errore: se fallisce adesso, la riga potrebbe
        // essere sul foglio lo stesso (la risposta puo' perdersi dopo che il
        // foglio e' stato modificato) e va verificata prima di riprovare.
        // Se invece fallisce prima, niente e' stato toccato e si puo' passare
        // ad Apps Script senza cerimonie.
        inviata = true;
        return chiamaSheets(API_SHEETS + FOGLIO_ID + ':batchUpdate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ requests: req })
        }).then(function () {
          return { riga: piano.rigaNuova, ms: Date.now() - t0, richieste: req.length };
        });
      }).catch(function (e) {
        e.inviata = inviata;
        // Permesso mancante o scaduto: il token e' inutile, si butta. Senza
        // questo ogni salvataggio successivo ritenterebbe la stessa strada
        // chiusa, pagando l'attesa ogni volta.
        if (e.stato === 401 || e.stato === 403) {
          scartaToken();
          if (typeof mostraStatoGoogle === 'function') mostraStatoGoogle();
        }
        throw e;
      });
    }
    var TABS = {
      Riccardo: { Euro: 113020932, Franchi: 650699013 },
      Roberta:  { Euro: 1888286288, Franchi: 1063479927 }
    };
    var persona = 'Riccardo', conto = 'Euro', segno = false;

    document.getElementById('data').value = new Date().toISOString().slice(0, 10);
    function gid() { return TABS[persona][conto]; }

    // ---- Lettura delle risposte del backend ----
    // Apps Script ogni tanto risponde con una PAGINA HTML al posto del JSON: il
    // /exec passa da un redirect su googleusercontent, e quando quel passaggio
    // inciampa torna indietro una pagina di Google con stato 200. Chiamando
    // r.json() l'errore che ne esce e' opaco e cambia da browser a browser: su
    // Safari e' "The string did not match the expected pattern", che non dice
    // niente a nessuno e sembra un bug dell'app.
    //
    // Qui la risposta si legge come testo, si riconosce il caso e si alza un
    // errore comprensibile. Tutte le chiamate passano di qui: prima ognuna
    // faceva il proprio .json(), ed e' il motivo per cui lo stesso guasto e'
    // saltato fuori due volte in punti diversi.
    function leggiRisposta(r) {
      return r.text().then(function (t) {
        var s = (t || '').trim();
        if (s.charAt(0) === '<') {
          throw new Error('Il server ha risposto con una pagina invece dei dati');
        }
        try {
          return JSON.parse(s);
        } catch (e) {
          throw new Error('Risposta illeggibile dal server');
        }
      });
    }

    // Le letture si possono ripetere senza conseguenze, quindi ritentano da
    // sole: l'inciampo e' passeggero e sparisce al tentativo dopo.
    // Tetti CRESCENTI, non un unico tetto lungo.
    //
    // Da quando il backend tiene in cache i totali per foglio, una risposta
    // buona arriva in 1,2-1,6 secondi. Se non arriva entro pochi secondi vuol
    // dire che Apps Script sta inciampando, e restare in attesa mezzo minuto e'
    // tempo buttato: conviene mollare presto e riprovare. Con il tetto unico da
    // 50 s la prima schermata restava sui puntini anche 30 secondi buoni, ed e'
    // esattamente il "ci mette troppo" che si vedeva.
    // L'ultimo tentativo resta generoso per il caso in cui il calcolo sia
    // davvero freddo e stia solo macinando.
    // Il primo tetto deve stare COMODAMENTE sopra il tempo di una risposta
    // buona, non appena sopra. Con 7 s e una lettura che ne impiega 4-6, bastava
    // una richiesta gia' in coda per farlo scadere, e il ritentativo non
    // annullava la prima: se ne aggiungeva una seconda, che si accodava alla
    // prima e peggiorava proprio la congestione che aveva causato il ritardo.
    // Tre tentativi diventavano tre richieste tutte in fila.
    // Nessun tetto corto sulle LETTURE, e il motivo e' controintuitivo:
    // interrompere una fetch NON ferma l'esecuzione su Apps Script. La
    // richiesta scaduta continua a occupare la coda, quindi il ritentativo si
    // accoda dietro quella che stava gia' girando e ci mette di piu', non di
    // meno. Misurato sulla pagina viva dopo una spesa condivisa: primo
    // tentativo interrotto a 20,0 s, secondo 36,5 s e 404, card finita su "non
    // caricato". Con un tetto generoso il primo tentativo, che stava solo
    // macinando, sarebbe arrivato in fondo.
    //
    // Quindi: si aspetta, e si ritenta UNA volta sola, per il caso in cui la
    // risposta si sia persa davvero (il ritiro lato Google che torna 404).
    // La card intanto mostra i puntini, non un numero vecchio.
    var TETTI_MS = [45000, 45000];
    var PAUSE_MS = [3000];

    // OGNI lettura porta un parametro diverso, e non e' una precauzione teorica.
    //
    // Apps Script non risponde con i dati: risponde con un redirect verso
    // script.googleusercontent.com con una chiave usa e getta. Se il browser
    // ripresenta quel redirect preso dalla cache, la chiave e' gia' stata
    // consumata e la seconda tappa risponde 404 con una pagina HTML, che qui
    // diventa "non caricato, riprova" su un backend che sta benissimo.
    //
    // Visto in diretta sulla pagina viva: prima ?action=debiti 200 in 4,7 s,
    // poi la stessa identica URL due volte di fila, 404 e 404. Nel frattempo
    // ?action=cerca, che aveva una URL diversa, rispondeva in 1,8 s. Da
    // terminale non si riproduce, perche' quella cache non c'e': e' un difetto
    // che colpisce solo il browser, cioe' proprio la web app.
    function apiGet(url, tentativo) {
      tentativo = tentativo || 0;
      var ctrl = window.AbortController ? new AbortController() : null;
      var scaduto = setTimeout(function () { if (ctrl) ctrl.abort(); },
        TETTI_MS[tentativo] || 45000);
      var url1 = url + (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
      var opz = { cache: 'no-store' };
      if (ctrl) opz.signal = ctrl.signal;
      return fetch(url1, opz)
        .then(leggiRisposta)
        .then(function (j) { clearTimeout(scaduto); return j; })
        .catch(function (e) {
          clearTimeout(scaduto);
          if (tentativo >= TETTI_MS.length - 1) throw e;
          // Una pausa ci vuole comunque: quando risponde con una pagina invece
          // dei dati e' perche' e' congestionato, e ributtarsi subito peggiora
          // la coda. Ma breve, altrimenti si somma all'attesa gia' spesa.
          return new Promise(function (ok) { setTimeout(ok, PAUSE_MS[tentativo] || 3000); })
            .then(function () { return apiGet(url, tentativo + 1); });
        });
    }

    // Le scritture NON seguono il rimando di Apps Script, e questa e' la
    // correzione che ha risolto i tempi lunghi.
    //
    // Una chiamata a /exec e' in DUE tappe: prima Apps Script esegue il codice e
    // risponde con un rimando, poi il client va a ritirare il risultato da
    // script.googleusercontent.com. Misurato sul foglio vero, sia da browser sia
    // da terminale, la prima tappa e' sempre di circa 3 secondi; e' la SECONDA
    // che ogni tanto si pianta e dopo 15-31 secondi restituisce una pagina di
    // errore invece dei dati. Sono quelli i "28 secondi" che si vedevano, e in
    // un caso la seconda tappa ha addirittura restituito la risposta di doGet,
    // cioe' di tutt'altra richiesta.
    //
    // Ma quel giro di ritorno non serve: quando Apps Script risponde con il
    // rimando, il codice ha gia' girato e la riga e' gia' sul foglio. Quindi
    // con redirect:'manual' ci si ferma li'. La conferma arriva subito dopo da
    // ?action=cerca, che e' un'esecuzione corta.
    // Provato: con il rimando seguito, una scrittura su quattro tornava
    // illeggibile; senza, sei su sei a buon fine.
    //
    // Il tetto resta generoso perche' interrompere una fetch NON ferma
    // l'esecuzione su Apps Script: un tetto corto non libera niente, aggiunge
    // solo un'esecuzione che continua a girare per conto suo.
    var TETTO_POST_MS = 45000;

    // Con il rimando seguito: serve dove la risposta va letta davvero (saldare,
    // annullare, cancellare). Sono operazioni rare, quindi il rischio di
    // incappare nella seconda tappa lenta si paga volentieri.
    function apiPost(corpo) {
      var ctrl = window.AbortController ? new AbortController() : null;
      var scaduto = setTimeout(function () { if (ctrl) ctrl.abort(); }, TETTO_POST_MS);
      var opzioni = {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(corpo)
      };
      if (ctrl) opzioni.signal = ctrl.signal;
      return fetch(API, opzioni)
        .then(leggiRisposta)
        .then(function (j) { clearTimeout(scaduto); return j; })
        .catch(function (e) { clearTimeout(scaduto); throw e; });
    }

    // Senza seguire il rimando: per l'inserimento di una spesa, che e'
    // l'operazione frequente e quella che deve essere veloce. Si chiude appena
    // Apps Script ha eseguito, senza aspettare il ritiro del risultato. Il
    // corpo della risposta non e' leggibile, e infatti non lo si usa: la
    // conferma la da' ?action=cerca subito dopo.
    function apiPostSenzaRitorno(corpo) {
      var ctrl = window.AbortController ? new AbortController() : null;
      var scaduto = setTimeout(function () { if (ctrl) ctrl.abort(); }, TETTO_POST_MS);
      var opzioni = {
        method: 'POST',
        redirect: 'manual',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(corpo)
      };
      if (ctrl) opzioni.signal = ctrl.signal;
      return fetch(API, opzioni)
        .then(function (r) {
          clearTimeout(scaduto);
          // Caso normale: rimando non seguito, niente da leggere e niente da
          // leggere serve. Se un browser lo seguisse comunque, si legge.
          if (r.type === 'opaqueredirect' || r.status === 0) return { dati: null };
          return leggiRisposta(r).then(function (j) { return { dati: j }; });
        })
        .catch(function (e) { clearTimeout(scaduto); throw e; });
    }

    function initSeg(id, onPick) {
      var box = document.getElementById(id);
      box.addEventListener('click', function (ev) {
        var b = ev.target.closest('button'); if (!b) return;
        [].forEach.call(box.children, function (c) { c.classList.remove('on'); });
        b.classList.add('on');
        onPick(b.getAttribute('data-v'));
      });
    }
    // Cambiare persona o conto ridisegna e basta: i quattro totali sono gia'
    // arrivati con l'unica lettura di ?action=debiti. Qui c'era una richiesta al
    // backend per ogni tocco, ed e' quello che rendeva lento passare da un tab
    // all'altro (soprattutto sull'euro, i due fogli piu' grossi).
    function cambiaTab() {
      // L'esito di un "Saldato" riguarda il foglio su cui e' stato premuto:
      // lasciarlo in piedi cambiando tab lo farebbe leggere come se riguardasse
      // quello nuovo.
      document.getElementById('saldaMsg').textContent = '';
      caricaCategorie();
      mostraDebito();
    }
    initSeg('persona', function (v) { persona = v; cambiaTab(); });
    initSeg('conto', function (v) {
      conto = v;
      document.getElementById('labImporto').textContent = 'Importo (' + (v === 'Euro' ? '€' : 'CHF') + ')';
      cambiaTab();
    });

    document.getElementById('check').addEventListener('click', function () {
      segno = !segno;
      var b = document.getElementById('checkBox');
      b.classList.toggle('on', segno);
      b.textContent = segno ? '✓' : '';
    });

    var catReq = 0; // token: solo l'ultima richiesta puo' scrivere nella select
    var catLetti = {}; // gid gia' chiesti in questa sessione

    function caricaCategorie() {
      var sel = document.getElementById('categoria');
      var mio = ++catReq;
      var mioGid = gid();

      // Si mostra SUBITO l'elenco conosciuto e la rete serve solo ad
      // aggiornarlo. Senza categorie non si puo' inserire niente, quindi farle
      // dipendere da una risposta di Apps Script (che sotto carico risponde con
      // pagine di errore) rendeva il form inutilizzabile per minuti interi.
      var note = categorieNote();
      if (note.length) riempiCategorie(sel, note);
      else sel.innerHTML = '<option value="">Caricamento…</option>';

      // Con un elenco gia' noto e recente non si tocca la rete: cambiare tab
      // non deve costare una richiesta (vedi categorieDaRinfrescare).
      if (!categorieDaRinfrescare()) return;
      // E comunque un foglio si chiede una volta sola per sessione.
      if (catLetti[mioGid]) return;
      catLetti[mioGid] = true;

      apiGet(API + '?action=categorie&gid=' + mioGid)
        .then(function (j) {
          // Una risposta senza ok non e' un elenco vuoto: e' un errore, e va
          // trattata come tale o la select resta muta senza spiegazione.
          if (!j || !j.ok) throw new Error('risposta non valida');
          if (mio !== catReq) return;
          var cats = j.categorie || [];
          if (cats.length) salvaCategorie(cats);
          var tutte = categorieNote();
          if (tutte.length) riempiCategorie(sel, tutte);
          else sel.innerHTML = '<option value="">(nessuna categoria)</option>';
        })
        .catch(function () {
          // Non riuscita: si toglie il segno, cosi' il prossimo passaggio su
          // questo foglio riprova invece di restare senza elenco per sempre.
          delete catLetti[mioGid];
          if (mio !== catReq) return;
          // Con un elenco gia' noto non si segnala niente: si puo' inserire lo
          // stesso, e le categorie non cambiano quasi mai.
          if (categorieNote().length) return;
          sel.innerHTML = '<option value="">(errore, tocca per riprovare)</option>';
        });
    }

    // Mantiene la scelta corrente se e' ancora fra le opzioni: ricaricare la
    // lista mentre stai compilando non deve spostarti la categoria scelta.
    function riempiCategorie(sel, cats) {
      var prima = sel.value;
      sel.innerHTML = '';
      cats.forEach(function (c) {
        var o = document.createElement('option');
        o.value = c; o.textContent = c; sel.appendChild(o);
      });
      if (prima && cats.indexOf(prima) >= 0) sel.value = prima;
    }

    // UN SOLO elenco, non uno per foglio.
    //
    // `?action=categorie` restituisce solo le categorie GIA' USATE in quel tab,
    // quindi su Riccardo franchi non compariva "Abbigliamento" per il semplice
    // motivo che li' non era mai stata usata: un cerchio chiuso, perche' senza
    // la voce nell'elenco la prima spesa non la puoi nemmeno inserire.
    // Tenendo l'unione di tutto quello che si e' visto sui quattro fogli, ogni
    // categoria resta scegliibile ovunque e non "sparisce" cambiando conto.
    var CHIAVE_CAT = 'rmoney_categorie';
    var CHIAVE_CAT_QUANDO = 'rmoney_categorie_quando';
    var ETA_MAX_CAT_MS = 24 * 60 * 60 * 1000;

    function categorieNote() {
      try {
        var v = JSON.parse(localStorage.getItem(CHIAVE_CAT) || '[]');
        return (v && v.length) ? v : [];
      } catch (e) { return []; }
    }

    // Si chiedono al foglio SOLO se non se ne conosce nessuna, o se l'elenco ha
    // piu' di un giorno.
    //
    // Era il difetto piu' grosso rimasto. Toccando un foglio mai aperto in
    // quella sessione partiva una richiesta per le categorie, che legge tutta
    // la colonna piu' la convalida dati: misurata a 26,0 s con esito 404, e il
    // ritentativo a 45,0 s. Apps Script serializza, quindi la spesa scritta
    // subito dopo restava in coda dietro quella e finiva su "Verifico sul
    // foglio…". Capitava su Roberta Euro e sui due fogli in franchi, e NON su
    // Riccardo Euro, che essendo il tab di partenza le aveva gia' prese
    // all'apertura: e' il "funziona solo Riccardo Euro" che si vedeva.
    //
    // L'elenco e' l'unione di quello visto su tutti i fogli e non cambia quasi
    // mai (una categoria nuova si aggiunge a mano sul foglio, non dall'app),
    // quindi un giro al giorno basta.
    function categorieDaRinfrescare() {
      if (!categorieNote().length) return true;
      try {
        var quando = parseInt(localStorage.getItem(CHIAVE_CAT_QUANDO) || '0', 10) || 0;
        return (Date.now() - quando) > ETA_MAX_CAT_MS;
      } catch (e) { return true; }
    }

    function salvaCategorie(cats) {
      try {
        var unione = categorieNote();
        cats.forEach(function (c) {
          c = String(c).trim();
          if (c && unione.indexOf(c) < 0) unione.push(c);
        });
        unione.sort(function (a, b) { return a.localeCompare(b, 'it'); });
        localStorage.setItem(CHIAVE_CAT, JSON.stringify(unione));
        localStorage.setItem(CHIAVE_CAT_QUANDO, String(Date.now()));
      } catch (e) { /* spazio pieno o modalita' privata: pazienza */ }
    }

    caricaCategorie();

    // Rete tornata, o inciampo passeggero: toccare la select riprova.
    document.getElementById('categoria').addEventListener('focus', function () {
      var o = this.options[0];
      if (this.options.length === 1 && o && o.value === '' && /errore/.test(o.textContent)) {
        caricaCategorie();
      }
    });

    // ---- Debito condiviso (righe con la spunta split) ----
    // Nessun helper che legga persona/conto globali: il rendering deve usare
    // solo la fotografia presa quando la richiesta e' partita (vedi caricaDebito).
    // Una richiesta sola porta i totali di TUTTI E QUATTRO i fogli
    // (?action=debiti). Cambiare persona o conto non fa piu' partire niente:
    // il numero e' gia' arrivato.
    //
    // Non e' una cache. I quattro totali sono letti dal foglio nello stesso
    // istante, non vengono salvati da nessuna parte e non sopravvivono alla
    // chiusura della pagina. Prima invece ogni cambio di tab costava un giro
    // completo sul backend, e se il precedente era ancora in volo si accodavano:
    // Apps Script serializza le richieste dello stesso utente, quindi la seconda
    // aspettava la prima e a volte scadeva. Sul telefono si e' visto anche
    // peggio, con la lettura dell'euro fallita due volte di fila mentre la
    // pagina caricava le sue.
    var fogliDebito = null;  // ultimo giro di letture, solo in memoria

    // La card del debito e' STACCATA dalla scrittura: non la fa aspettare e non
    // ne viene azzerata. Prima erano legate, e si vedeva.
    //
    // Salvando una spesa condivisa la card tornava sui puntini e ci restava
    // 8,5 secondi misurati (4,5 di attesa voluta + 4 di lettura), perche' i
    // totali arrivavano attaccati alla conferma della scrittura. Se quella
    // lettura andava male, il numero spariva del tutto e restava "non caricato".
    // Da qui il "non si vede piu' il debito": non era rotto, era in attesa.
    //
    // Adesso i due percorsi non si toccano:
    //   - la conferma della scrittura chiede solo ?action=cerca, subito, senza
    //     i quattro totali e senza i 4,5 secondi di attesa che servivano a loro;
    //   - il debito si aggiorna per conto suo, e nel frattempo il numero resta
    //     a schermo con la scritta "aggiorno…" di fianco al titolo.
    //
    // Il numero mostrato durante l'aggiornamento non e' vecchio: appena la
    // scrittura e' confermata si somma la meta' della spesa appena inserita
    // (aggiornaDebitoLocale), che e' la stessa aritmetica che fa il foglio. La
    // lettura che arriva dopo lo conferma, e se mai fosse diversa vince lei.
    var debitoInCorso = false;      // c'e' una lettura in volo
    var debitoRitentativo = 0;       // quale ritentativo e' in corso, 0 = il primo giro
    var CHIAVI_META = ['totale', 'meta', 'conteggio'];

    // Somma al totale in memoria una spesa condivisa appena scritta sul foglio.
    // Non e' una stima: e' l'importo che abbiamo appena mandato noi, sul foglio
    // che abbiamo scelto noi, e il foglio ne fara' la meta' esattamente come qui.
    function aggiornaDebitoLocale(gidScritto, importo) {
      if (!fogliDebito) return;
      var v = Math.abs(parseFloat(String(importo).replace(',', '.')));
      if (!isFinite(v) || v === 0) return;
      var f = fogliDebito[gidScritto];
      if (!f) { f = fogliDebito[gidScritto] = { totale: 0, meta: 0, conteggio: 0 }; }
      for (var i = 0; i < CHIAVI_META.length; i++) {
        if (typeof f[CHIAVI_META[i]] !== 'number') f[CHIAVI_META[i]] = 0;
      }
      f.totale += v;
      f.meta += v / 2;
      f.conteggio += 1;
      mostraDebito();
    }

    // Rende la card con quello che c'e', senza toccare la rete.
    function mostraDebito() {
      var foglioLbl = document.getElementById('debtFoglioLbl');
      var foglioVal = document.getElementById('debtFoglioVal');
      var netLbl = document.getElementById('debtNetLbl');
      var netVal = document.getElementById('debtNetVal');
      var saldaBtn = document.getElementById('saldaBtn');
      var stato = document.getElementById('debtStato');

      var altra = persona === 'Riccardo' ? 'Roberta' : 'Riccardo';
      var simb = conto === 'Euro' ? '€' : 'CHF';

      foglioLbl.textContent = altra + ' deve a ' + persona;
      netLbl.textContent = 'Saldo netto ' + conto;
      saldaBtn.textContent = 'Saldato · azzera split ' + persona + ' ' + conto;
      // Il messaggio del "Saldato" NON si tocca qui: questa funzione gira anche
      // quando la lettura finisce, e cancellerebbe l'esito appena scritto
      // ("Azzerate N spunte") un attimo dopo averlo mostrato.

      // I puntini e "non caricato" valgono solo quando non c'e' nessun numero da
      // mostrare, cioe' alla prima apertura. Se un numero c'e' gia' non si
      // cancella per rileggerlo: si lascia a schermo e si dice di fianco al
      // titolo che sta arrivando quello nuovo.
      // Card fredda: nessun numero ancora. Niente "non caricato": o sta
      // arrivando, o manca la rete, che e' un fatto del telefono e si risolve
      // da solo. In nessuno dei due casi c'e' qualcosa di rotto da segnalare.
      if (!fogliDebito) {
        saldaBtn.disabled = true;
        if (debitoSospeso && navigator.onLine === false) {
          foglioVal.textContent = 'senza rete'; foglioVal.className = 'debtVal zero';
          netVal.textContent = ''; netVal.className = 'debtVal';
          stato.textContent = 'riprovo appena torna'; stato.className = 'debtStato';
        } else {
          foglioVal.textContent = '…'; foglioVal.className = 'debtVal';
          netVal.textContent = '…'; netVal.className = 'debtVal';
          stato.textContent = debitoRitentativo ? 'ci mette più del solito, riprovo…' : '';
          stato.className = 'debtStato';
        }
        return;
      }

      var mio = fogliDebito[TABS[persona][conto]] || { meta: 0 };
      var suo = fogliDebito[TABS[altra][conto]] || { meta: 0 };

      // Il "saldato" azzera spunte in modo irreversibile alla cieca se il numero
      // sotto gli occhi non e' quello del foglio: si blocca finche' non lo e'.
      saldaBtn.disabled = debitoInCorso;
      if (debitoSospeso && navigator.onLine === false) {
        stato.textContent = 'senza rete, riprovo appena torna';
      } else if (debitoRitentativo) {
        stato.textContent = 'ci mette più del solito, riprovo…';
      } else if (debitoInCorso) {
        stato.textContent = 'aggiorno…';
      } else {
        stato.textContent = '';
      }
      stato.className = 'debtStato';

      // Meta condivisa di questo foglio (quanto l'altra persona deve).
      if (mio.meta > 0.005) {
        foglioVal.textContent = fmtImporto(mio.meta, simb);
        foglioVal.className = 'debtVal';
      } else {
        foglioVal.textContent = 'nessuna spesa condivisa';
        foglioVal.className = 'debtVal zero';
      }

      // Saldo netto per valuta: meta(mio) - meta(partner).
      var netto = mio.meta - suo.meta;
      var abs = Math.abs(netto);
      if (abs < 0.005) {
        netVal.textContent = 'in pari';
        netVal.className = 'debtVal zero';
      } else {
        var chi = netto > 0 ? altra : persona;
        var aChi = netto > 0 ? persona : altra;
        netLbl.textContent = chi + ' deve a ' + aChi + ' (' + conto + ')';
        netVal.textContent = fmtImporto(abs, simb);
        netVal.className = 'debtVal';
      }
    }

    // La pagina su GitHub Pages e il backend su Apps Script non cambiano nello
    // stesso istante: la pagina resta in cache una decina di minuti, e il
    // backend si aggiorna a mano. Quindi una versione nuova della pagina puo'
    // benissimo trovarsi davanti un backend vecchio. Se non conosce
    // ?action=debiti risponde con il suo JSON informativo, senza "fogli": in
    // quel caso si ripiega sulle due letture per valuta, che esistono da
    // sempre. Senza questo la card resterebbe su "non caricato" fino al deploy.
    //
    // NON esiste uno stato di errore per il debito. Si riprova finche' non
    // risponde, e basta. Prima i tentativi erano uno, poi tre, e in entrambi i
    // casi finito il conto la card diceva "non caricato": un errore che non
    // descrive niente di rotto, perche' la lettura dopo funziona quasi sempre.
    // Misurato mentre il backend era in giornata storta: tre letture singole su
    // quattro fallite (16,3 s, 21,4 s e 50,6 s, tutte con una pagina HTML al
    // posto del JSON) e la quarta riuscita in 3,1 s. Con numeri cosi' nessun
    // numero fisso di tentativi tiene, mentre riprovare a oltranza arriva sempre
    // in fondo. Il costo e' che ogni tanto ci vuole piu' tempo, non che compare
    // un errore. I tempi di attesa crescono (2, 5, 10, 20, poi 30 secondi) cosi'
    // un backend in difficolta' non viene martellato.
    //
    // Qui c'era scritto "UN SOLO tentativo, niente ritentativi",
    // e il motivo era che interrompere una fetch non ferma l'esecuzione su Apps
    // Script: la lettura abbandonata continuava a girare e il ritentativo si
    // aggiungeva, e in quel minuto una spesa scritta restava in fila dietro.
    // Quel motivo non esiste piu': la scrittura non passa piu' di qui (posta con
    // redirect: 'manual' e si conferma da sola con ?action=cerca) e il debito ha
    // il suo percorso separato, quindi una lettura abbandonata non puo' piu'
    // mettersi davanti a niente che l'utente stia aspettando.
    //
    // Senza ritentativi la card finiva in errore per sempre alla prima botta, ed
    // e' quello che si vedeva sull'iPhone: "non caricato, tocca qui" su un
    // backend perfettamente sano. Misurato, sei letture di fila dal browser:
    //
    //   1a  45,0 s  interrotta dal tetto
    //   2a   4,2 s  ok
    //   3a  38,3 s  ok
    //   4a  33,3 s  ok
    //   5a  35,1 s  404
    //
    // Scomposta nelle sue due tappe, la colpa non e' della consegna (il ritiro
    // da googleusercontent sta sempre fra 360 e 514 ms) ma dell'avvio: 26,9 s e
    // 27,0 s a freddo contro 2,8-3,1 s a caldo. E non e' il foglio: la stessa
    // chiamata con una action inesistente, che il foglio non lo apre nemmeno,
    // costa 1,0-2,5 s, quindi leggere i quattro fogli pesa 0,3-2,6 s in tutto.
    // E' Apps Script che ci mette mezzo minuto a partire, esattamente come sulle
    // scritture lente. Non si accorcia dal client: si riprova.
    var TETTO_DEBITO_MS = 45000; // generoso: a freddo l'avvio da solo prende 27 s
    // Le pause salgono fino a due minuti. Con un tetto basso, su un backend in
    // difficolta' ogni pagina aperta gli tirava addosso due esecuzioni al minuto
    // per sempre, cioe' carico proprio quando ne ha meno margine. Il debito e'
    // un'informazione: puo' aspettare, la scrittura no.
    var PAUSE_DEBITO_MS = [2000, 5000, 10000, 20000, 30000, 60000, 120000];

    // Vero da quando parte una scrittura a quando la sua conferma e' finita.
    // Il debito non deve MAI avere una richiesta in volo in quella finestra:
    // separare i due percorsi serviva a non farli aspettare a vicenda, ma se poi
    // si contendono lo stesso backend il salvataggio torna lento lo stesso.
    var scritturaInCorso = false;

    function leggiDebitiUnaVolta() {
      var ctrl = window.AbortController ? new AbortController() : null;
      var scaduto = setTimeout(function () { if (ctrl) ctrl.abort(); }, TETTO_DEBITO_MS);
      var opz = { cache: 'no-store' };
      if (ctrl) opz.signal = ctrl.signal;
      return fetch(API + '?action=debiti&_=' + Date.now(), opz)
        .then(leggiRisposta)
        .then(function (j) {
          clearTimeout(scaduto);
          if (j && j.fogli) return j.fogli;
          return leggiDebitiPerValuta();
        })
        .catch(function (e) { clearTimeout(scaduto); throw e; });
    }

    // Timer del prossimo tentativo, per poterlo annullare quando ne parte una
    // piu' recente o quando l'utente tocca la card per non aspettare la pausa.
    var debitoAttesa = null;
    // Vero quando si e' smesso di riprovare in attesa di una condizione esterna
    // (pagina in secondo piano, telefono senza rete). Non e' un errore: si
    // riparte da soli appena la condizione cambia.
    var debitoSospeso = false;

    function annullaAttesaDebito() {
      if (debitoAttesa) { clearTimeout(debitoAttesa); debitoAttesa = null; }
    }

    // Un tentativo, e in caso di buca il successivo. Non finisce mai in errore:
    // o riesce, o si sospende aspettando rete o primo piano.
    function provaDebito(mio, ritardoMs) {
      return new Promise(function (ok) {
        if (!ritardoMs) { ok(); return; }
        debitoAttesa = setTimeout(function () { debitoAttesa = null; ok(); }, ritardoMs);
      }).then(function () {
        if (mio !== debitoReq) return;
        // Una scrittura in corso ha la precedenza assoluta: si riprova fra poco.
        if (scritturaInCorso) return provaDebito(mio, 2000);
        return leggiDebitiUnaVolta().then(function (fogli) {
          if (mio !== debitoReq) return;
          debitoInCorso = false;
          debitoSospeso = false;
          debitoRitentativo = 0;
          fogliDebito = fogli; // il foglio ha sempre ragione sul conto locale
          mostraDebito();
        }, function () {
          if (mio !== debitoReq) return;
          debitoRitentativo++;
          // Senza rete non ha senso insistere: consuma batteria e non puo'
          // riuscire. Si riparte dall'evento "online".
          // Con la pagina in secondo piano nemmeno: nessuno la sta guardando.
          if ((navigator.onLine === false) || document.visibilityState === 'hidden') {
            debitoSospeso = true;
            mostraDebito();
            return;
          }
          mostraDebito();
          var i = Math.min(debitoRitentativo - 1, PAUSE_DEBITO_MS.length - 1);
          return provaDebito(mio, PAUSE_DEBITO_MS[i]);
        });
      });
    }

    function leggiDebitiPerValuta() {
      var fogli = {};
      // In sequenza, mai insieme: Apps Script serializza le richieste dello
      // stesso utente e lanciarle in parallelo le fa scadere a vicenda.
      return ['Euro', 'Franchi'].reduce(function (prima, c) {
        return prima.then(function () {
          return apiGet(API + '?action=debito&gid=' + TABS.Riccardo[c]
            + '&gidPartner=' + TABS.Roberta[c])
            .then(function (j) {
              var d = j && j.debito;
              if (!d || !d.mio) throw new Error('risposta senza il debito');
              fogli[TABS.Riccardo[c]] = d.mio;
              fogli[TABS.Roberta[c]] = d.partner;
            });
        });
      }, Promise.resolve()).then(function () { return fogli; });
    }

    // Quanto si aspetta prima di rileggere il debito DOPO una scrittura.
    //
    // Appena una riga viene scritta il foglio ricalcola (i SOMMARIO e la pivot
    // leggono i LOG), e una lettura lanciata in quel momento resta ferma ad
    // aspettarlo. Misurato sul foglio vero dopo una spesa condivisa su LOG
    // RICCARDO, sempre la stessa lettura di ?action=debiti:
    //
    //   lanciata subito ......... 36,26 s
    //   4 secondi dopo ........... 4,29 s
    //   8 secondi dopo ........... 3,91 s
    //
    // La scrittura in se' era durata 2,3 s. Era questo a far sembrare
    // lentissima una spesa condivisa: il salvataggio finiva subito, ma la card
    // del debito restava sui puntini per mezzo minuto e chiudeva su "non
    // caricato, riprova", perche' la rilettura partiva addosso al ricalcolo e
    // scadeva. Quattro secondi bastano, qui c'e' mezzo secondo di margine.
    //
    // ?action=cerca NON soffre di questo (2,12 s misurati subito dopo una
    // scrittura), quindi la verifica dopo una risposta persa resta immediata.
    var ATTESA_RILETTURA_MS = 4500;

    // Rilegge i quattro totali dal foglio. Da chiamare all'avvio e dopo ogni
    // scrittura che tocca le spunte, non a ogni cambio di tab.
    var debitoReq = 0; // token: solo l'ultima lettura puo' scrivere il risultato

    function caricaDebito(ritardoMs) {
      var mio = ++debitoReq;
      // Il numero che c'e' resta dov'e'. Azzerarlo qui era il motivo per cui la
      // card spariva a ogni salvataggio di una spesa condivisa.
      debitoInCorso = true;
      debitoSospeso = false;
      debitoRitentativo = 0;
      annullaAttesaDebito();
      document.getElementById('saldaMsg').textContent = '';
      mostraDebito();
      // Nessun ramo di fallimento: provaDebito o riesce o si sospende in attesa
      // di rete o di primo piano, e riparte da solo.
      return provaDebito(mio, ritardoMs || 0);
    }

    // Riprende dopo una sospensione: si torna sull'app, oppure torna la rete.
    function riprendiDebito() {
      if (debitoSospeso) caricaDebito();
    }
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') riprendiDebito();
    });
    window.addEventListener('online', riprendiDebito);

    // Qui c'era una cache del debito in localStorage, una per ognuna delle
    // quattro combinazioni persona/conto, piu' un precaricamento in sottofondo
    // delle altre tre dopo la prima lettura riuscita.
    //
    // Tolta apposta, e non va rimessa. Serviva a coprire un backend che
    // impiegava decine di secondi, ma una volta scritta una combinazione non
    // veniva piu' aggiornata finche' non la si guardava, quindi ogni
    // dispositivo conservava la fotografia del momento in cui l'aveva aperta e
    // i tre mostravano tre numeri diversi. Il precaricamento per giunta
    // sparava tre richieste in piu' a ogni prima apertura, e Apps Script
    // serializza le richieste dello stesso utente: contribuiva alla lentezza
    // che la cache doveva mascherare.
    //
    // Il totale ora arriva dal foglio a ogni lettura (backend v27, che legge
    // solo le colonne importo e spunta). Se serve renderlo piu' veloce, si
    // legge di meno, non si conserva di piu'.
    // Ripulisce le chiavi lasciate dalle versioni precedenti: senza, restano
    // in localStorage per sempre senza che nessuno le legga.
    (function scartaVecchiaCacheDebito() {
      try {
        for (var i = localStorage.length - 1; i >= 0; i--) {
          var k = localStorage.key(i);
          if (k && k.indexOf('rmoney_debito_') === 0) localStorage.removeItem(k);
        }
      } catch (e) { /* modalita' privata: pazienza */ }
    })();

    // Se la lettura non e' riuscita, toccare la card riprova. E' l'alternativa
    // al ritentativo automatico, che intasava la coda davanti alle scritture.
    // Bersaglio grande: tutta la card, non la scritta piccola. Su un telefono
    // "tocca qui" su due parole in grigio e' un bersaglio da pochi millimetri.
    // Il pulsante "Saldato" e' escluso, altrimenti premerlo farebbe anche
    // ripartire una lettura.
    // Toccare non e' piu' necessario, perche' non si smette mai di riprovare:
    // serve solo a saltare la pausa fra un tentativo e il successivo, che a fine
    // scala e' di trenta secondi. Se una lettura e' davvero in volo non si fa
    // niente, altrimenti si buttano via i venti secondi gia' aspettati.
    document.getElementById('debt').addEventListener('click', function (ev) {
      if (ev.target.closest('#saldaBtn')) return;
      if (debitoAttesa || debitoSospeso) caricaDebito();
    });

    caricaDebito();

    // ---------- Stato del collegamento Google ----------
    // Due sole cose da dire: da quale strada passa il salvataggio, e se serve
    // un tocco per ricollegarsi. Mai un errore: senza collegamento l'app
    // funziona esattamente come prima.
    function mostraStatoGoogle() {
      var s = document.getElementById('gStato');
      var b = document.getElementById('gCollega');
      if (tokenValido()) {
        s.textContent = 'Scrittura diretta sul foglio, attiva';
        b.hidden = true;
        return;
      }
      // Con il gettone di rinnovo in mano non c'e' niente da chiedere
      // all'utente: il permesso si sta gia' rifacendo da solo.
      if (gettoneRinnovo()) {
        s.textContent = 'Rinnovo il permesso…';
        b.hidden = true;
        return;
      }
      s.textContent = haGiaCollegato()
        ? 'Accesso Google da rifare'
        : 'Salvataggio tramite Apps Script';
      b.hidden = false;
      b.textContent = haGiaCollegato() ? 'Ricollega Google' : 'Collega Google';
      b.disabled = false;
    }

    document.getElementById('gCollega').addEventListener('click', function () {
      var b = this;
      b.disabled = true;
      document.getElementById('gStato').textContent = 'Collegamento…';
      // Nasce da un tocco, quindi il browser lascia aprire la finestra di
      // Google. E' l'unica volta che serve: da qui in poi ci pensa il gettone
      // di rinnovo.
      collegaGoogle()
        .then(mostraStatoGoogle)
        .catch(function (e) {
          document.getElementById('gStato').textContent = 'Non collegato: ' + e.message;
          b.disabled = false;
        });
    });

    // All'apertura: se c'e' il gettone di rinnovo e il permesso e' scaduto, lo
    // si rifa' subito, in sottofondo e senza mostrare niente. E' questo che
    // rende l'accesso permanente. Se il gettone non c'e' (accesso mai fatto, o
    // consenso revocato) resta il pulsante.
    (function riprendiGoogle() {
      mostraStatoGoogle();
      if (!gettoneRinnovo()) return;
      if (tokenValido()) { programmaRinnovo(); return; }
      rinnovaToken().catch(function () { mostraStatoGoogle(); });
    })();

    // Il permesso dura un'ora: quando scade la riga lo dice da sola, senza che
    // l'utente scopra la cosa nel mezzo di un salvataggio.
    setInterval(mostraStatoGoogle, 30000);

    // Pulsante di annullamento, mostrato solo dopo un azzeramento riuscito.
    // Il backend ricorda quali righe erano spuntate, quindi rimetterle e' una
    // sola chiamata. Resta disponibile finche' non si ricarica la pagina: un
    // errore lo si nota subito, e piu' tardi sarebbe rischioso rimettere spunte
    // su righe che nel frattempo possono essere cambiate.
    function mostraAnnulla(gidFatto, quante) {
      var m = document.getElementById('saldaMsg');
      var b = document.createElement('button');
      b.className = 'saldaBtn';
      b.textContent = '↩ Annulla: rimetti le ' + quante + ' spunte';
      b.addEventListener('click', function () {
        b.disabled = true;
        m.className = 'saldaMsg'; m.textContent = 'Ripristino…';
        apiPost({ op: 'annullaSalda', gid: gidFatto })
          .then(function (j) {
            if (j && j.ok) {
              m.className = 'saldaMsg ok';
              m.textContent = '✓ Rimesse ' + (j.rimesse || 0) + ' spunte';
              b.remove();
              caricaDebito(ATTESA_RILETTURA_MS);
            } else {
              m.className = 'saldaMsg err';
              m.textContent = 'Errore: ' + ((j && j.error) || 'sconosciuto');
              b.disabled = false;
            }
          })
          .catch(function () {
            m.className = 'saldaMsg err';
            m.textContent = 'Rete non raggiungibile, riprova';
            b.disabled = false;
          });
      });
      m.parentNode.insertBefore(b, m.nextSibling);
    }

    // Bottone "saldato": azzera le spunte split del SOLO foglio selezionato.
    document.getElementById('saldaBtn').addEventListener('click', function () {
      var m = document.getElementById('saldaMsg');
      // La conferma dice QUANTO si sta per azzerare, non solo che si sta per
      // fare qualcosa: un "sei sicuro?" generico si accetta per riflesso, un
      // numero davanti agli occhi no. E' gia' successo di perdere 29 spunte.
      var quante = document.getElementById('debtFoglioVal').textContent;
      var ok = confirm('Azzerare le spunte "split" di ' + persona + ' ' + conto + '?\n\n'
        + 'Riguarda ' + quante + ' di spese condivise.\n\n'
        + 'Le spese restano nel foglio: vengono tolte solo le spunte, quindi non '
        + 'saranno più conteggiate come condivise. Dopo avrai un pulsante per annullare.');
      if (!ok) return;
      var btn = this;
      btn.disabled = true; m.className = 'saldaMsg'; m.textContent = 'Azzeramento…';
      apiPost({ op: 'salda', gid: gid() })
        .then(function (j) {
          if (j && j.ok) {
            var gidFatto = gid();
            caricaDebito(ATTESA_RILETTURA_MS); // ricalcola dopo il ricalcolo del foglio
            m.className = 'saldaMsg ok'; m.textContent = '✓ Azzerate ' + (j.azzerate || 0) + ' spunte';
            if (j.annullabile) mostraAnnulla(gidFatto, j.azzerate || 0);
          } else {
            m.className = 'saldaMsg err'; m.textContent = 'Errore: ' + ((j && j.error) || 'sconosciuto');
          }
          btn.disabled = false;
        })
        .catch(function () {
          // Una fetch fallita non dice se il foglio sia stato toccato o no.
          // Invece di lasciare il dubbio, ricontrolliamo il totale reale: se e'
          // ancora diverso da zero l'azzeramento non e' passato e si puo' riprovare.
          m.className = 'saldaMsg'; m.textContent = 'Errore di rete, verifico…';
          apiGet(API + '?action=debito&gid=' + gid())
            .then(function (j) {
              var d = j && j.debito && j.debito.mio;
              if (d && d.conteggio === 0) {
                m.className = 'saldaMsg ok'; m.textContent = '✓ Era comunque andata a buon fine';
              } else {
                m.className = 'saldaMsg err';
